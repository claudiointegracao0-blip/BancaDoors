,"disciplina":"redes","assunto":"Sub-redes IPv4 e CIDR","dificuldade":3,"enunciado":"Considere um host configurado com o endereço IPv4 172.16.37.200 e a máscara de sub-rede 255.255.240.0 (prefixo /20). Sobre a sub-rede à qual esse host pertence, é correto afirmar:","alternativas":["O endereço de rede é 172.16.36.0, o de broadcast é 172.16.39.255 e há 1.022 endereços utilizáveis por hosts.","O endereço de rede é 172.16.32.0, o de broadcast é 172.16.63.255 e há 8.190 endereços utilizáveis por hosts.","O endereço de rede é 172.16.32.0, o de broadcast é 172.16.47.255 e há 4.094 endereços utilizáveis por hosts.","O endereço de rede é 172.16.37.0, o de broadcast é 172.16.37.255 e há 254 endereços utilizáveis por hosts.","O endereço de rede é 172.16.0.0, o de broadcast é 172.16.255.255 e há 65.534 endereços utilizáveis por hosts."],"correta":2,"comentario":"A máscara /20 reserva 4 bits de rede no terceiro octeto, formando blocos de 16 (0, 16, 32, 48...). O valor 37 cai no bloco de 32 a 47: rede 172.16.32.0 e broadcast 172.16.47.255. Com 12 bits de host, há 2^12 - 2 = 4.094 endereços utilizáveis."},{"id":"fcc-redes-02","disciplina":"redes","assunto":"Roteamento dinâmico: OSPF e RIP","dificuldade":2,"enunciado":"Sobre os protocolos de roteamento dinâmico RIP e OSPF, é correto afirmar que","alternativas":["o OSPF é um protocolo de estado de enlace que usa o algoritmo de Dijkstra para calcular as rotas de menor custo.","o RIP é um protocolo de estado de enlace cuja métrica é o custo derivado da largura de banda de cada enlace.","o OSPF adota a contagem de saltos como métrica e considera inalcançável o destino que está a 16 saltos.","o RIP divide o sistema autônomo em áreas, todas elas conectadas a uma área de backbone, denominada área 0.","o OSPF é um protocolo de gateway exterior, usado para a troca de rotas entre sistemas autônomos distintos."],"correta":0,"comentario":"O OSPF é um protocolo interior de estado de enlace: cada roteador conhece a topologia da área e aplica Dijkstra, com métrica de custo e áreas ligadas à área 0. O RIP é de vetor de distância e usa contagem de saltos (16 significa inalcançável). Protocolo de gateway exterior é o BGP."},{"id":"fcc-redes-03","disciplina":"redes","assunto":"ICMP, ping e traceroute","dificuldade":2,"enunciado":"O utilitário traceroute (tracert, no Windows) é usado para identificar os roteadores existentes no caminho até um destino. Seu funcionamento baseia-se","alternativas":["no envio de mensagens ICMP de redirecionamento, às quais cada roteador responde informando sua tabela de rotas.","em consultas ARP sucessivas, que retornam o endereço MAC de cada roteador existente no caminho até o destino.","no envio de pacotes com TTL decrescente e nas mensagens ICMP de eco devolvidas por cada roteador do caminho.","em uma conexão TCP com a porta 7 de cada roteador, que devolve ao emissor os dados recebidos (serviço de eco).","no envio de pacotes com TTL crescente e nas mensagens ICMP de tempo excedido devolvidas pelos roteadores."],"correta":4,"comentario":"O traceroute envia pacotes com TTL igual a 1, 2, 3 e assim por diante. Cada roteador decrementa o TTL e, quando ele chega a zero, descarta o pacote e devolve uma mensagem ICMP Time Exceeded, revelando seu endereço. Já o ping usa as mensagens ICMP Echo Request e Echo Reply."},{"id":"fcc-redes-04","disciplina":"redes","assunto":"Fibra monomodo x multimodo","dificuldade":1,"enunciado":"Em relação às fibras ópticas monomodo e multimodo, utilizadas em cabeamento estruturado, é correto afirmar:","alternativas":["A fibra multimodo tem núcleo de menor diâmetro e, por isso, é a mais indicada para enlaces de longa distância.","A fibra monomodo tem núcleo de menor diâmetro e alcança distâncias maiores do que a fibra multimodo.","A fibra monomodo propaga vários modos de luz simultaneamente, o que aumenta a dispersão modal do sinal.","A fibra multimodo é imune à dispersão modal, razão pela qual supera a monomodo em alcance e em taxa.","A fibra monomodo é sujeita à interferência eletromagnética, ao contrário da multimodo, que é imune a ela."],"correta":1,"comentario":"A fibra monomodo tem núcleo muito fino (cerca de 9 micrômetros) e propaga um único modo de luz, sem dispersão modal, o que permite enlaces de dezenas de quilômetros. A multimodo tem núcleo maior (50 ou 62,5 micrômetros), propaga vários modos e é usada em distâncias curtas."},{"id":"fcc-redes-05","disciplina":"redes","assunto":"Portas bem conhecidas","dificuldade":1,"enunciado":"Considere os protocolos HTTPS, SSH e SMTP e as portas TCP padrão em que os respectivos servidores aguardam conexões. A associação correta é:","alternativas":["HTTPS na porta 443, SSH na porta 23 e SMTP na porta 110.","HTTPS na porta 80, SSH na porta 22 e SMTP na porta 143.","HTTPS na porta 8080, SSH na porta 21 e SMTP na porta 25.","HTTPS na porta 443, SSH na porta 22 e SMTP na porta 25.","HTTPS na porta 443, SSH na porta 22 e SMTP na porta 53."],"correta":3,"comentario":"As portas padrão são 443 para HTTPS, 22 para SSH e 25 para SMTP. As demais portas citadas pertencem a outros serviços: 21 é FTP (controle), 23 é Telnet, 53 é DNS, 80 é HTTP, 110 é POP3 e 143 é IMAP."},{"id":"fcc-redes-06","disciplina":"redes","assunto":"SSH, Telnet, FTP e SFTP","dificuldade":2,"enunciado":"Sobre os protocolos de acesso remoto e de transferência de arquivos, é correto afirmar que","alternativas":["o Telnet cifra a sessão com criptografia simétrica, embora transmita a senha do usuário em texto claro.","o FTP usa uma única conexão TCP, na porta 21, para transportar tanto os comandos quanto os arquivos transferidos.","o SFTP opera como subsistema do SSH e trafega comandos e dados cifrados em uma única conexão, na porta 22.","o SFTP é o protocolo FTP encapsulado em TLS e mantém as conexões de controle e de dados nas portas 21 e 20.","o SSH opera sobre UDP, na porta 22, e dispensa a autenticação do servidor perante o cliente."],"correta":2,"comentario":"O SFTP (SSH File Transfer Protocol) roda sobre o SSH: uma só conexão cifrada, por padrão na porta 22. Não se confunde com o FTPS, que é o FTP protegido por TLS. O FTP clássico separa controle (porta 21) e dados, e o Telnet não cifra nada. O SSH usa TCP e autentica o servidor por sua chave."},{"id":"fcc-seguranca-01","disciplina":"seguranca","assunto":"Criptografia assimétrica","dificuldade":3,"enunciado":"Considere as afirmativas sobre criptografia assimétrica:\\nI. A segurança do RSA está associada à dificuldade de fatorar o produto de dois números primos grandes.\\nII. O Diffie-Hellman é usado para cifrar e assinar mensagens, mas não para estabelecer chaves.\\nIII. Para um nível de segurança equivalente, a criptografia de curvas elípticas usa chaves menores do que o RSA.\\nEstá correto o que se afirma em","alternativas":["I e II, apenas.","I e III, apenas.","II e III, apenas.","III, apenas.","I, II e III."],"correta":1,"comentario":"I está certa: o RSA apoia-se na dificuldade de fatorar o produto de dois primos grandes. III está certa: uma chave de curva elíptica de 256 bits equivale, aproximadamente, a uma RSA de 3.072 bits. II está errada: o Diffie-Hellman serve para o acordo de chaves em canal inseguro, não para cifrar nem assinar."},{"id":"fcc-seguranca-02","disciplina":"seguranca","assunto":"Firewalls","dificuldade":2,"enunciado":"Sobre os tipos de firewall, é correto afirmar que","alternativas":["o filtro de pacotes sem estado examina o conteúdo da camada de aplicação para bloquear ataques como a injeção de SQL.","o WAF atua nas camadas de rede e de transporte, filtrando pacotes apenas por endereços IP e portas.","o firewall de proxy encaminha os pacotes diretamente entre cliente e servidor, sem intermediar as conexões.","o firewall de inspeção de estado mantém uma tabela de conexões e avalia cada pacote no contexto de sua conexão.","o firewall de inspeção de estado trata cada pacote isoladamente, sem considerar os anteriores do mesmo fluxo."],"correta":3,"comentario":"O firewall stateful registra as conexões ativas em uma tabela de estados e decide com base nela, liberando, por exemplo, o tráfego de retorno. O filtro sem estado examina só os cabeçalhos de cada pacote. O proxy intermedeia as conexões, e o WAF inspeciona o tráfego HTTP na camada de aplicação."},{"id":"fcc-seguranca-03","disciplina":"seguranca","assunto":"SQL Injection","dificuldade":1,"enunciado":"O ataque de SQL Injection explora aplicações que montam comandos SQL concatenando dados fornecidos pelo usuário, sem o devido tratamento. Uma medida eficaz para prevenir esse ataque é","alternativas":["utilizar consultas parametrizadas (prepared statements), que separam o comando SQL dos dados.","validar os campos dos formulários somente no navegador, com scripts executados no lado do cliente.","armazenar as senhas dos usuários no banco de dados na forma de hash com salt.","trafegar as requisições por HTTPS, cifrando os dados entre o navegador e o servidor web.","conceder à conta usada pela aplicação os privilégios de administrador do banco de dados."],"correta":0,"comentario":"Nas consultas parametrizadas, o comando é preparado com marcadores e os valores são enviados à parte, de modo que nunca são interpretados como código SQL. A validação feita só no cliente pode ser contornada, e HTTPS e hash de senhas não impedem a injeção. Privilégio excessivo apenas agrava o dano."},{"id":"fcc-seguranca-04","disciplina":"seguranca","assunto":"Gestão de riscos (ISO/IEC 27005)","dificuldade":2,"enunciado":"Na gestão de riscos de segurança da informação, conforme a ISO/IEC 27005, uma organização decide contratar um seguro para cobrir as perdas que determinado risco pode causar. Essa opção de tratamento do risco corresponde","alternativas":["à retenção (aceitação) do risco, pois a organização decide conviver com ele sem adotar nenhuma ação.","à modificação (redução) do risco, pois são implantados controles que diminuem a probabilidade do evento.","à ação de evitar o risco, pois a atividade que dá origem ao risco deixa de ser realizada.","à identificação do risco, pois são levantados os ativos, as ameaças e as vulnerabilidades existentes.","ao compartilhamento (transferência) do risco, pois parte das consequências é assumida por um terceiro."],"correta":4,"comentario":"A ISO/IEC 27005 prevê quatro opções de tratamento: modificar (reduzir) o risco por meio de controles, reter (aceitar), evitar e compartilhar (transferir). Contratar um seguro divide as consequências do risco com outra parte, o que caracteriza o compartilhamento."},{"id":"fcc-seguranca-05","disciplina":"seguranca","assunto":"LGPD: conceitos e papéis","dificuldade":2,"enunciado":"De acordo com a Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018), é correto afirmar que","alternativas":["o operador é a pessoa indicada para atuar como canal de comunicação entre o controlador, os titulares e a ANPD.","o consentimento do titular é a única base legal que autoriza o tratamento de dados pessoais.","o controlador é a pessoa natural ou jurídica a quem competem as decisões referentes ao tratamento de dados pessoais.","o dado anonimizado é considerado dado pessoal sensível e exige consentimento específico e destacado.","o encarregado é a pessoa natural ou jurídica que realiza o tratamento de dados pessoais em nome do controlador."],"correta":2,"comentario":"Pela LGPD, o controlador decide sobre o tratamento, o operador trata os dados em nome do controlador e o encarregado é o canal de comunicação com os titulares e a ANPD. O consentimento é apenas uma das bases legais do art. 7º, e o dado anonimizado, em regra, não é considerado dado pessoal."},{"id":"fcc-seguranca-06","disciplina":"seguranca","assunto":"Hardening","dificuldade":1,"enunciado":"No contexto da segurança de servidores, o processo de hardening consiste em","alternativas":["reduzir a superfície de ataque do sistema, desativando serviços desnecessários e ajustando configurações.","simular ataques reais contra o sistema, explorando suas vulnerabilidades para demonstrar o impacto que causariam.","duplicar os componentes de hardware do servidor, para que ele continue operando em caso de falha de um deles.","copiar periodicamente os dados do servidor para outra mídia, a fim de permitir sua restauração posterior.","coletar e correlacionar os eventos gerados pelos sistemas, a fim de detectar incidentes de segurança."],"correta":0,"comentario":"Hardening é o endurecimento do sistema: remover ou desativar serviços, contas e portas desnecessários, aplicar correções e configurar o ambiente com o mínimo privilégio, reduzindo a superfície de ataque. As demais descrições tratam de teste de invasão, redundância, backup e SIEM."},{"id":"fcc-banco-de-dados-01","disciplina":"banco-de-dados","assunto":"SQL: SELECT com junções","dificuldade":2,"enunciado":"Considere as tabelas Departamento (id, nome) e Funcionario (id, nome, id_depto), em que id_depto referencia Departamento. Deseja-se listar todos os departamentos, inclusive os que não possuem funcionários, com os nomes dos respectivos funcionários. O comando SQL que produz esse resultado é:","alternativas":["SELECT d.nome, f.nome FROM Departamento d INNER JOIN Funcionario f ON d.id = f.id_depto;","SELECT d.nome, f.nome FROM Departamento d RIGHT JOIN Funcionario f ON d.id = f.id_depto;","SELECT d.nome, f.nome FROM Departamento d CROSS JOIN Funcionario f;","SELECT d.nome, f.nome FROM Departamento d LEFT JOIN Funcionario f ON d.id = f.id_depto;","SELECT d.nome, f.nome FROM Departamento d, Funcionario f WHERE d.id = f.id_depto;"],"correta":3,"comentario":"O LEFT JOIN preserva todas as linhas da tabela à esquerda (Departamento) e preenche com NULL as colunas de Funcionario quando não há correspondência. O INNER JOIN e a junção feita no WHERE descartam os departamentos sem funcionários, e o RIGHT JOIN preservaria as linhas de Funcionario."},{"id":"fcc-banco-de-dados-02","disciplina":"banco-de-dados","assunto":"Níveis de isolamento e anomalias","dificuldade":3,"enunciado":"O padrão SQL define os níveis de isolamento de transações em função das anomalias de leitura que cada um admite. De acordo com o padrão, no nível REPEATABLE READ,","alternativas":["não ocorre leitura suja, mas podem ocorrer leitura não repetível e leitura fantasma.","não ocorrem leitura suja nem leitura não repetível, mas pode ocorrer leitura fantasma.","podem ocorrer leitura suja, leitura não repetível e leitura fantasma.","não ocorrem leitura suja, leitura não repetível nem leitura fantasma.","não ocorre leitura fantasma, mas podem ocorrer leitura suja e leitura não repetível."],"correta":1,"comentario":"No padrão SQL, READ UNCOMMITTED admite as três anomalias; READ COMMITTED impede a leitura suja; REPEATABLE READ impede também a leitura não repetível, mas ainda admite fantasmas; SERIALIZABLE impede todas. Leitura fantasma é o surgimento de novas linhas que satisfazem a mesma condição de busca."},{"id":"fcc-banco-de-dados-03","disciplina":"banco-de-dados","assunto":"Visões e visões materializadas","dificuldade":2,"enunciado":"Sobre visões (views) e visões materializadas em bancos de dados relacionais, é correto afirmar que","alternativas":["a visão comum armazena fisicamente uma cópia dos dados, atualizada a cada alteração feita nas tabelas base.","a visão materializada é recalculada a cada consulta e, por isso, não ocupa espaço adicional em disco.","a visão comum não pode ser referenciada na cláusula FROM de um comando SELECT.","a visão materializada é uma tabela temporária, eliminada automaticamente ao término da sessão do usuário.","a visão materializada armazena o resultado da consulta em disco e pode ficar defasada até ser atualizada."],"correta":4,"comentario":"A visão comum é uma consulta armazenada: guarda só a definição e é executada sobre as tabelas base a cada uso. A visão materializada grava o resultado em disco, o que acelera as leituras, mas exige atualização (refresh) para refletir as mudanças ocorridas nas tabelas base."},{"id":"fcc-banco-de-dados-04","disciplina":"banco-de-dados","assunto":"Operações OLAP","dificuldade":1,"enunciado":"Em uma ferramenta OLAP, um analista visualiza o total de vendas por ano e, em seguida, passa a visualizá-lo por trimestre e por mês, aumentando o nível de detalhe dos dados. A operação realizada é","alternativas":["drill-down, que navega de um nível mais resumido para um nível mais detalhado de uma hierarquia.","roll-up, que navega de um nível mais detalhado para um nível mais resumido de uma hierarquia.","slice, que fixa um único valor de uma dimensão e produz um subcubo com uma dimensão a menos.","pivot, que rotaciona os eixos do cubo para apresentar os dados sob outra perspectiva.","dice, que seleciona valores em duas ou mais dimensões e produz um subcubo menor."],"correta":0,"comentario":"Passar de ano para trimestre e mês é descer na hierarquia da dimensão tempo, aumentando o detalhe: drill-down. O roll-up faz o caminho inverso, agregando os dados. Slice e dice selecionam partes do cubo, e pivot apenas gira os eixos de visualização."},{"id":"fcc-banco-de-dados-05","disciplina":"banco-de-dados","assunto":"Replicação e sharding","dificuldade":1,"enunciado":"Em bancos de dados distribuídos, a técnica denominada sharding consiste em","alternativas":["manter cópias idênticas de todos os dados em vários servidores, a fim de aumentar a disponibilidade.","dividir uma tabela em grupos de colunas, mantendo todos os grupos armazenados no mesmo servidor.","particionar os dados horizontalmente, distribuindo as linhas entre vários servidores conforme uma chave.","guardar em memória os resultados das consultas mais frequentes, a fim de reduzir o tempo de resposta.","reunir várias transações em uma única gravação no log, a fim de reduzir a quantidade de acessos a disco."],"correta":2,"comentario":"Sharding é o particionamento horizontal distribuído: as linhas são divididas em fragmentos (shards) segundo uma chave, e cada fragmento fica em um servidor, o que permite escalar horizontalmente. Manter cópias dos mesmos dados em vários servidores é replicação, técnica que pode ser combinada ao sharding."},{"id":"fcc-banco-de-dados-06","disciplina":"banco-de-dados","assunto":"Operadores de conjunto e nulos","dificuldade":2,"enunciado":"Sobre operadores de conjunto e valores nulos em SQL, é correto afirmar que","alternativas":["a comparação coluna = NULL resulta em verdadeiro para as linhas em que a coluna não possui valor.","a função COUNT(coluna) inclui na contagem as linhas em que a coluna possui valor nulo.","o operador INTERSECT retorna as linhas da primeira consulta que não aparecem no resultado da segunda.","o operador UNION elimina as linhas duplicadas do resultado, ao passo que o UNION ALL as mantém.","o operador EXCEPT retorna somente as linhas que aparecem nos resultados das duas consultas."],"correta":3,"comentario":"UNION remove duplicatas e UNION ALL preserva todas as linhas. INTERSECT retorna as linhas comuns às duas consultas, e EXCEPT, as da primeira ausentes na segunda. Comparar com NULL usando = resulta em desconhecido (usa-se IS NULL), e COUNT(coluna) ignora os valores nulos."},{"id":"fcc-engenharia-de-software-01","disciplina":"engenharia-de-software","assunto":"Kanban e Lean","dificuldade":2,"enunciado":"No método Kanban, a prática de limitar o trabalho em progresso (WIP, work in progress) tem por objetivo","alternativas":["fixar a duração das iterações em períodos iguais, ao fim dos quais a equipe entrega um incremento do produto.","definir papéis obrigatórios para a equipe, como o dono do produto e o responsável por remover impedimentos.","aumentar a quantidade de tarefas iniciadas ao mesmo tempo, para que nenhum membro da equipe fique ocioso.","estimar o esforço de cada item em pontos de história, antes de sua entrada no quadro de tarefas.","restringir a quantidade de itens em cada etapa do fluxo, o que evidencia gargalos e favorece a conclusão."],"correta":4,"comentario":"Limitar o WIP restringe quantos itens podem estar ao mesmo tempo em cada coluna do quadro. Isso cria um sistema puxado, expõe gargalos e reduz o tempo de ciclo, pois a equipe termina o que começou antes de puxar novo trabalho. Iterações de duração fixa e papéis prescritos são do Scrum."},{"id":"fcc-engenharia-de-software-02","disciplina":"engenharia-de-software","assunto":"UML: diagramas comportamentais","dificuldade":1,"enunciado":"Entre os diagramas da UML, o diagrama de sequência é aquele que","alternativas":["descreve os estados pelos quais um objeto passa durante sua vida e as transições disparadas por eventos.","modela o fluxo de controle entre ações, com nós de decisão, bifurcações (fork) e junções (join).","representa a troca de mensagens entre objetos, ordenadas no tempo, ao longo de linhas de vida.","mostra a distribuição física dos artefatos de software pelos nós de hardware do ambiente.","apresenta as funcionalidades do sistema e os atores externos que interagem com cada uma delas."],"correta":2,"comentario":"O diagrama de sequência é um diagrama de interação: mostra objetos com suas linhas de vida e as mensagens trocadas entre eles em ordem temporal. Estados e transições pertencem ao diagrama de máquina de estados, e fluxos com decisões, forks e joins, ao diagrama de atividades."},{"id":"fcc-engenharia-de-software-03","disciplina":"engenharia-de-software","assunto":"Padrões GoF estruturais","dificuldade":2,"enunciado":"Sobre os padrões de projeto estruturais do catálogo GoF, é correto afirmar que o padrão","alternativas":["Adapter converte a interface de uma classe em outra interface, esperada pelos clientes.","Facade anexa responsabilidades adicionais a um objeto dinamicamente, em vez de recorrer à herança.","Decorator fornece uma interface unificada e simplificada para um conjunto de interfaces de um subsistema.","Proxy compõe objetos em estruturas de árvore para representar hierarquias do tipo parte-todo.","Composite fornece um substituto de outro objeto, a fim de controlar o acesso a ele."],"correta":0,"comentario":"O Adapter permite que classes com interfaces incompatíveis trabalhem juntas. Nas demais, as definições foram trocadas: anexar responsabilidades dinamicamente é Decorator; interface unificada para um subsistema é Facade; árvore parte-todo é Composite; substituto que controla o acesso é Proxy."},{"id":"fcc-engenharia-de-software-04","disciplina":"engenharia-de-software","assunto":"APIs REST e idempotência","dificuldade":3,"enunciado":"Considere uma API REST que segue a semântica dos métodos definida para o protocolo HTTP. Nesse contexto, é correto afirmar que","alternativas":["o método POST é seguro e idempotente, pois não altera o estado dos recursos mantidos pelo servidor.","o método PUT é idempotente, pois repetir a mesma requisição tem o mesmo efeito de executá-la uma única vez.","o método GET não é seguro, pois sua semântica prevê a modificação do recurso solicitado.","o método DELETE não é idempotente, pois cada repetição da requisição deve remover um novo recurso.","o servidor deve guardar em sessão o estado de cada cliente entre as requisições, conforme a restrição stateless."],"correta":1,"comentario":"Um método é idempotente quando várias requisições idênticas têm o mesmo efeito de uma só: é o caso de GET, PUT e DELETE. O GET é também seguro, pois apenas lê. O POST não é seguro nem idempotente. A restrição stateless determina o oposto do afirmado: cada requisição traz todo o contexto necessário."},{"id":"fcc-engenharia-de-software-05","disciplina":"engenharia-de-software","assunto":"Manutenção de software","dificuldade":2,"enunciado":"Um sistema em produção precisou ser modificado para continuar funcionando depois que a organização atualizou a versão do sistema operacional e do SGBD, sem nenhuma mudança em suas funcionalidades. Trata-se de manutenção","alternativas":["corretiva, pois elimina defeitos descobertos durante o uso do software.","perfectiva, pois aprimora funcionalidades ou atende a novos pedidos dos usuários.","preventiva, pois reestrutura o código para evitar falhas e facilitar manutenções futuras.","adaptativa, pois ajusta o software a mudanças ocorridas em seu ambiente de operação.","emergencial, pois restabelece um serviço que se encontrava totalmente indisponível."],"correta":3,"comentario":"A manutenção adaptativa adequa o software a mudanças do ambiente externo, como novo sistema operacional, SGBD ou hardware. A corretiva conserta defeitos, a perfectiva melhora ou acrescenta funcionalidades e a preventiva atua antes que os problemas apareçam."},{"id":"fcc-engenharia-de-software-06","disciplina":"engenharia-de-software","assunto":"Manifesto Ágil","dificuldade":1,"enunciado":"De acordo com os valores e princípios do Manifesto Ágil, é correto afirmar:","alternativas":["Processos e ferramentas são mais valorizados do que indivíduos e interações.","Software em funcionamento é mais valorizado do que documentação abrangente.","A negociação de contratos é mais valorizada do que a colaboração com o cliente.","Seguir um plano é mais valorizado do que responder a mudanças.","Mudanças de requisitos devem ser recusadas quando surgem tardiamente no desenvolvimento."],"correta":1,"comentario":"O Manifesto valoriza mais: indivíduos e interações, software em funcionamento, colaboração com o cliente e resposta a mudanças, sem desprezar os itens do outro lado (processos, documentação, contratos e planos). Um de seus princípios é aceitar mudanças de requisitos, mesmo no fim do desenvolvimento."},{"id":"fcc-sistemas-operacionais-01","disciplina":"sistemas-operacionais","assunto":"Algoritmos de escalonamento","dificuldade":2,"enunciado":"Sobre os algoritmos de escalonamento de processos, é correto afirmar que","alternativas":["o Round Robin é preemptivo e concede a cada processo da fila de prontos uma fatia de tempo, denominada quantum.","o FCFS é preemptivo e retira da CPU o processo em execução sempre que chega à fila um processo mais curto.","o SJF não preemptivo escolhe o processo que está há mais tempo na fila de prontos, qualquer que seja sua duração.","o escalonamento por prioridades impede, por si só, a inanição (starvation) dos processos de baixa prioridade.","o Round Robin com quantum muito grande passa a se comportar de modo equivalente ao algoritmo SJF."],"correta":0,"comentario":"No Round Robin, cada processo recebe um quantum; se não terminar, é preemptado e volta ao fim da fila. Com quantum muito grande, degenera em FCFS, que não é preemptivo. O SJF escolhe o menor tempo de CPU previsto, e prioridades podem causar starvation, mitigada com envelhecimento (aging)."},{"id":"fcc-sistemas-operacionais-02","disciplina":"sistemas-operacionais","assunto":"Substituição de páginas","dificuldade":3,"enunciado":"Sobre os algoritmos de substituição de páginas usados na gerência de memória virtual, é correto afirmar que","alternativas":["o algoritmo ótimo substitui a página que está há mais tempo na memória e é amplamente adotado em sistemas reais.","o LRU substitui a página carregada na memória há mais tempo, sem considerar quando ela foi usada pela última vez.","o FIFO substitui a página que ficou mais tempo sem ser referenciada e, por isso, é imune à anomalia de Belady.","o algoritmo do relógio (segunda chance) consulta o bit de referência e poupa a página que foi usada recentemente.","o LRU está sujeito à anomalia de Belady, em que mais molduras de memória podem gerar mais faltas de página."],"correta":3,"comentario":"O relógio percorre as páginas em lista circular: se o bit de referência é 1, zera-o e avança; se é 0, substitui a página. O ótimo troca a página que demorará mais a ser usada e é só referência teórica. O FIFO troca a mais antiga e sofre a anomalia de Belady, o que não ocorre com o LRU."},{"id":"fcc-sistemas-operacionais-03","disciplina":"sistemas-operacionais","assunto":"Linux: estrutura de diretórios (FHS)","dificuldade":1,"enunciado":"De acordo com o padrão de hierarquia do sistema de arquivos (FHS), adotado pelas distribuições Linux, é correto afirmar que o diretório","alternativas":["/var contém os arquivos especiais que representam dispositivos, como discos e terminais.","/bin contém os diretórios pessoais dos usuários comuns do sistema.","/etc contém os arquivos de configuração do sistema e dos serviços instalados.","/dev contém dados variáveis, como arquivos de log e filas de impressão.","/home contém os arquivos necessários à inicialização, como o kernel e o carregador de boot."],"correta":2,"comentario":"No FHS, /etc guarda os arquivos de configuração. Os dispositivos ficam em /dev, os dados variáveis (logs, filas) em /var, os diretórios pessoais em /home, os binários essenciais em /bin e os arquivos de inicialização, como o kernel, em /boot."},{"id":"fcc-sistemas-operacionais-04","disciplina":"sistemas-operacionais","assunto":"RAID","dificuldade":2,"enunciado":"Sobre os níveis de RAID utilizados em arranjos de discos, é correto afirmar que","alternativas":["o RAID 0 espelha os dados em dois discos, de modo que a falha de um deles não causa perda de informação.","o RAID 1 divide os dados em faixas (striping), sem redundância, privilegiando o desempenho e a capacidade.","o RAID 6 usa paridade simples, exige no mínimo três discos e tolera a falha de apenas um deles.","o RAID 10 combina striping com dupla paridade distribuída e exige no mínimo três discos.","o RAID 5 distribui dados e paridade entre os discos, exige no mínimo três deles e tolera a falha de um."],"correta":4,"comentario":"O RAID 5 usa striping com paridade distribuída: mínimo de três discos e tolerância a uma falha. O RAID 0 é striping sem redundância; o RAID 1 é espelhamento; o RAID 6 usa dupla paridade (mínimo de quatro discos, tolera duas falhas); o RAID 10 combina espelhamento e striping (mínimo de quatro)."},{"id":"fcc-sistemas-operacionais-05","disciplina":"sistemas-operacionais","assunto":"Linux: usuários, grupos e sudo","dificuldade":2,"enunciado":"No Linux, sobre a administração de usuários, grupos e privilégios, é correto afirmar que","alternativas":["o arquivo /etc/passwd armazena os hashes das senhas dos usuários e, por isso, só pode ser lido pelo usuário root.","o arquivo /etc/sudoers define as regras de uso do sudo e deve ser editado por meio do comando visudo.","o arquivo /etc/group registra o histórico dos comandos executados com sudo por cada usuário do sistema.","o comando usermod -aG remove o usuário de todos os grupos suplementares aos quais ele pertence.","o usuário root é identificado pelo UID 1000, valor atribuído à primeira conta criada na instalação."],"correta":1,"comentario":"O /etc/sudoers contém as regras do sudo, e o visudo valida a sintaxe antes de salvar. O /etc/passwd é legível por todos e não guarda os hashes, que ficam em /etc/shadow. O /etc/group lista grupos e membros, usermod -aG acrescenta o usuário a grupos suplementares e o root tem UID 0."},{"id":"fcc-sistemas-operacionais-06","disciplina":"sistemas-operacionais","assunto":"Linux: cron e pacotes","dificuldade":1,"enunciado":"Sobre o agendamento de tarefas com o cron e o gerenciamento de pacotes no Linux, é correto afirmar que","alternativas":["nas distribuições derivadas do Debian, o apt instala pacotes .deb e resolve suas dependências.","o comando crontab -r abre o arquivo de agendamentos do usuário para edição em um editor de textos.","em uma linha do crontab, o primeiro campo indica a hora e o segundo campo indica o minuto da execução.","o rpm é o formato de pacote nativo das distribuições Debian e Ubuntu, instalado com o comando dpkg.","o comando crontab -l remove todos os agendamentos do usuário que o executa."],"correta":0,"comentario":"O apt é o gerenciador de alto nível da família Debian: baixa pacotes .deb dos repositórios e resolve dependências. O formato rpm é da família Red Hat (dnf ou yum). No crontab, os campos são minuto, hora, dia do mês, mês e dia da semana; a opção -e edita, -l lista e -r remove os agendamentos."},{"id":"fcc-programacao-01","disciplina":"programacao","assunto":"Listas encadeadas","dificuldade":1,"enunciado":"Sobre a estrutura de dados lista encadeada, em comparação com o vetor (array), é correto afirmar:","alternativas":["O acesso ao elemento de uma posição qualquer da lista encadeada é realizado em tempo constante, O(1).","Os nós de uma lista encadeada ocupam posições contíguas de memória, o que exige fixar seu tamanho na criação.","A inserção de um nó no início de uma lista simplesmente encadeada é realizada em tempo constante, O(1).","Em uma lista duplamente encadeada, cada nó armazena somente a referência para o nó seguinte.","A busca binária aplica-se diretamente a uma lista encadeada ordenada, com custo O(log n)."],"correta":2,"comentario":"Inserir no início exige apenas criar o nó e ajustar a referência da cabeça da lista: custo O(1), sem deslocar elementos. Em contrapartida, o acesso por posição é sequencial, O(n), o que inviabiliza a busca binária eficiente. Os nós são alocados dinamicamente, sem contiguidade."},{"id":"fcc-programacao-02","disciplina":"programacao","assunto":"Ordenação simples","dificuldade":2,"enunciado":"Sobre os algoritmos de ordenação por bolha (bubble sort), por inserção (insertion sort) e por seleção (selection sort), é correto afirmar que","alternativas":["a ordenação por seleção tem custo O(n) no melhor caso, pois é interrompida ao detectar que o vetor está ordenado.","os três algoritmos têm custo O(n log n) no pior caso, o mesmo apresentado pelo mergesort.","a ordenação por bolha realiza, no máximo, uma troca de elementos a cada passagem pelo vetor.","a ordenação por inserção requer um vetor auxiliar de tamanho n, pois não ordena no próprio local.","a ordenação por inserção tem custo O(n) no melhor caso, que ocorre quando o vetor já está ordenado."],"correta":4,"comentario":"Com o vetor já ordenado, a ordenação por inserção faz apenas uma comparação por elemento: O(n). A seleção sempre percorre o restante do vetor em busca do menor, com O(n²) em qualquer caso, e faz no máximo uma troca por passagem. Os três são O(n²) no pior caso e ordenam no próprio local."},{"id":"fcc-programacao-03","disciplina":"programacao","assunto":"POO: sobrecarga x sobrescrita","dificuldade":2,"enunciado":"Em programação orientada a objetos, sobre classes abstratas, sobrecarga e sobrescrita de métodos, é correto afirmar que","alternativas":["a sobrecarga (overload) ocorre quando a subclasse redefine um método herdado, mantendo a mesma assinatura.","a sobrescrita (override) ocorre quando a subclasse redefine um método herdado, mantendo a mesma assinatura.","uma classe abstrata pode ser instanciada diretamente, desde que possua ao menos um método concreto.","a sobrescrita é resolvida em tempo de compilação, com base na quantidade e nos tipos dos parâmetros.","uma classe abstrata não pode declarar atributos nem métodos que possuam implementação."],"correta":1,"comentario":"Sobrescrita é a redefinição, na subclasse, de um método herdado com a mesma assinatura, resolvida em tempo de execução (polimorfismo dinâmico). Sobrecarga são métodos de mesmo nome com parâmetros diferentes. Classe abstrata não pode ser instanciada, mas pode ter atributos e métodos concretos."},{"id":"fcc-programacao-04","disciplina":"programacao","assunto":"JavaScript: tipos, escopo e promises","dificuldade":2,"enunciado":"Sobre tipos, escopo, closures e promises na linguagem JavaScript, é correto afirmar que","alternativas":["o operador typeof, quando aplicado a um array, retorna a string array.","uma Promise no estado rejected pode voltar ao estado pending e ser resolvida posteriormente.","uma closure impede a função interna de acessar as variáveis da função externa em que foi declarada.","uma variável declarada com let dentro de um bloco não pode ser acessada fora desse bloco.","o operador === converte os operandos para um mesmo tipo antes de realizar a comparação."],"correta":3,"comentario":"let e const têm escopo de bloco, ao passo que var tem escopo de função. O typeof de um array retorna object. Uma Promise, depois de cumprida ou rejeitada, não muda mais de estado. Closure é justamente a função que mantém acesso às variáveis do escopo em que foi criada. Quem converte tipos é o operador ==."},{"id":"fcc-programacao-05","disciplina":"programacao","assunto":"Heap e filas de prioridade","dificuldade":3,"enunciado":"Considere um heap binário de máximo (max-heap) com n elementos, armazenado em um vetor e usado para implementar uma fila de prioridade. É correto afirmar que","alternativas":["a remoção do maior elemento tem custo O(log n), pois é preciso restaurar a propriedade de heap.","a consulta ao maior elemento tem custo O(log n), pois ele pode estar em qualquer uma das folhas da árvore.","a busca por um elemento qualquer tem custo O(log n), pois o heap mantém os elementos totalmente ordenados.","a inserção de um elemento tem custo O(n), pois todos os elementos do vetor precisam ser deslocados.","o valor de cada nó é menor ou igual ao de seus filhos, de modo que o menor elemento fica na raiz."],"correta":0,"comentario":"No max-heap, cada nó é maior ou igual a seus filhos, e o maior elemento fica na raiz: consulta em O(1). Inserção e remoção da raiz custam O(log n), pois o elemento sobe ou desce no máximo a altura da árvore. O heap é só parcialmente ordenado, e a busca de um valor qualquer é O(n)."},{"id":"fcc-programacao-06","disciplina":"programacao","assunto":"Web services: SOAP x REST","dificuldade":1,"enunciado":"Sobre web services baseados em SOAP e em REST, é correto afirmar que","alternativas":["o REST é um protocolo padronizado pelo W3C que exige mensagens XML encapsuladas em um envelope.","o SOAP só pode ser transportado por HTTP e representa os dados exclusivamente em JSON.","o REST exige que a interface do serviço seja descrita em um documento WSDL publicado em um registro UDDI.","o SOAP é um estilo arquitetural, e não um protocolo, baseado em recursos identificados por URIs.","o SOAP é um protocolo com mensagens em XML, e seus serviços são normalmente descritos por meio de WSDL."],"correta":4,"comentario":"O SOAP é um protocolo: as mensagens são envelopes XML, o contrato é descrito em WSDL e o transporte pode ser HTTP, SMTP e outros. O REST é um estilo arquitetural baseado em recursos identificados por URIs e manipulados pelos métodos HTTP, com representações em JSON, XML e outros formatos."},{"id":"fcc-governanca-01","disciplina":"governanca","assunto":"ITIL 4: incidentes x problemas","dificuldade":1,"enunciado":"No ITIL 4, sobre os conceitos de incidente e de problema e as práticas correspondentes, é correto afirmar que","alternativas":["um incidente é uma causa, ou causa potencial, de um ou mais problemas.","um erro conhecido é um incidente cujo serviço já foi restaurado e cujo registro foi encerrado.","o propósito do gerenciamento de incidente é identificar e eliminar a causa raiz das falhas.","um problema é uma causa, ou causa potencial, de um ou mais incidentes.","uma solução de contorno elimina definitivamente a causa raiz de um problema."],"correta":3,"comentario":"No ITIL 4, incidente é a interrupção não planejada de um serviço ou a redução de sua qualidade, e a prática busca restaurar a operação normal o mais rápido possível. Problema é a causa, real ou potencial, de incidentes. Erro conhecido é um problema já analisado, mas ainda não resolvido."},{"id":"fcc-governanca-02","disciplina":"governanca","assunto":"PMBOK: grupos de processos e áreas","dificuldade":2,"enunciado":"De acordo com o Guia PMBOK 6ª edição, sobre os grupos de processos e as áreas de conhecimento, é correto afirmar que","alternativas":["o processo Desenvolver o Termo de Abertura do Projeto pertence ao grupo de Iniciação e à área de Integração.","o processo Criar a EAP pertence ao grupo de processos de Execução e à área de conhecimento de Cronograma.","o processo Identificar as Partes Interessadas pertence ao grupo de processos de Planejamento.","Monitoramento e Controle é uma das dez áreas de conhecimento, e Qualidade é um dos cinco grupos de processos.","o grupo de processos de Encerramento contém processos de todas as dez áreas de conhecimento."],"correta":0,"comentario":"No PMBOK 6, a Iniciação tem dois processos: Desenvolver o Termo de Abertura (Integração) e Identificar as Partes Interessadas. Criar a EAP é de Planejamento, na área de Escopo. Monitoramento e Controle é grupo de processos, Qualidade é área de conhecimento, e o Encerramento só tem processo de Integração."},{"id":"fcc-governanca-03","disciplina":"governanca","assunto":"Termo de abertura do projeto","dificuldade":2,"enunciado":"Em gerenciamento de projetos, o termo de abertura do projeto (project charter) é o documento que","alternativas":["decompõe as entregas do projeto em componentes menores e mais facilmente gerenciáveis.","registra os riscos identificados, com suas probabilidades, seus impactos e as respostas planejadas.","autoriza formalmente a existência do projeto e dá ao gerente autoridade para usar recursos da organização.","descreve em detalhes o escopo do produto, as entregas, as exclusões e os critérios de aceitação.","relaciona as pessoas e organizações afetadas pelo projeto, com seus interesses, expectativas e grau de influência."],"correta":2,"comentario":"O termo de abertura, emitido pelo patrocinador ou iniciador, autoriza formalmente o projeto e designa o gerente com autoridade para usar recursos. As outras descrições correspondem à EAP, ao registro dos riscos, à declaração do escopo e ao registro das partes interessadas."},{"id":"fcc-governanca-04","disciplina":"governanca","assunto":"BPM e BPMN","dificuldade":2,"enunciado":"Na notação BPMN, utilizada para a modelagem de processos de negócio, é correto afirmar que","alternativas":["o gateway exclusivo ativa ao mesmo tempo todos os caminhos de saída, sem avaliar nenhuma condição.","o gateway paralelo, representado por um losango com o sinal de mais, ativa todos os caminhos de saída.","o evento de fim é desenhado como um círculo de borda fina, e o evento de início, como um círculo de borda grossa.","as atividades são representadas por losangos, e os gateways, por retângulos de cantos arredondados.","o fluxo de mensagem liga atividades de uma mesma raia, e o fluxo de sequência liga piscinas (pools) distintas."],"correta":1,"comentario":"O gateway paralelo (losango com +) dispara todos os fluxos de saída, enquanto o exclusivo (losango vazio ou com X) segue um único caminho, conforme a condição. O evento de início tem borda fina e o de fim, borda grossa. O fluxo de mensagem liga pools distintos; o de sequência fica dentro do pool."},{"id":"fcc-governanca-05","disciplina":"governanca","assunto":"ISO/IEC 38500","dificuldade":3,"enunciado":"A ISO/IEC 38500 estabelece que os dirigentes devem governar a TI por meio de três tarefas principais: avaliar, dirigir e monitorar. Na tarefa de dirigir, os dirigentes","alternativas":["examinam e julgam o uso atual e futuro da TI, incluindo estratégias, propostas e arranjos de fornecimento.","acompanham, por meio de sistemas de medição, o desempenho da TI e a conformidade com as políticas.","executam diretamente as atividades operacionais de TI, como o atendimento de incidentes e de requisições.","contratam auditorias externas independentes para certificar os processos de TI da organização.","orientam a preparação e a implementação de estratégias e políticas alinhadas aos objetivos do negócio."],"correta":4,"comentario":"No modelo da ISO/IEC 38500, avaliar é examinar o uso atual e futuro da TI; dirigir é orientar a preparação e a implementação de estratégias e políticas, atribuindo responsabilidades; monitorar é acompanhar desempenho e conformidade. Executar a operação é papel da gestão, não da governança."},{"id":"fcc-governanca-06","disciplina":"governanca","assunto":"Ciclo PDCA","dificuldade":1,"enunciado":"No ciclo PDCA, empregado na melhoria contínua de processos, a etapa Check (verificar) consiste em","alternativas":["estabelecer os objetivos e os processos necessários para alcançar os resultados desejados.","executar as atividades conforme o que foi planejado, após capacitar as pessoas envolvidas.","medir os resultados obtidos e compará-los com as metas que foram planejadas.","adotar ações corretivas e padronizar as melhorias que se mostraram eficazes.","definir os métodos e os recursos que serão empregados para atingir as metas."],"correta":2,"comentario":"PDCA: Plan (planejar objetivos, metas e métodos), Do (executar o planejado), Check (verificar, medindo os resultados e comparando-os com o planejado) e Act (agir, corrigindo desvios e padronizando o que funcionou). O ciclo se repete, sustentando a melhoria contínua."},{"id":"fcc-infraestrutura-01","disciplina":"infraestrutura","assunto":"Sistemas de numeração","dificuldade":1,"enunciado":"O número 2F, representado no sistema hexadecimal, corresponde, nos sistemas decimal e binário, respectivamente, a","alternativas":["45 em decimal e 101101 em binário.","47 em decimal e 101111 em binário.","47 em decimal e 110111 em binário.","31 em decimal e 11111 em binário.","62 em decimal e 111110 em binário."],"correta":1,"comentario":"Em hexadecimal, 2F vale 2 x 16 + 15 = 47. Cada dígito hexadecimal equivale a 4 bits: 2 é 0010 e F é 1111, resultando em 0010 1111, ou 101111 sem os zeros à esquerda. Conferindo: 32 + 8 + 4 + 2 + 1 = 47."},{"id":"fcc-infraestrutura-02","disciplina":"infraestrutura","assunto":"Álgebra booleana e portas lógicas","dificuldade":1,"enunciado":"Sobre álgebra booleana e portas lógicas de duas entradas, é correto afirmar que","alternativas":["a porta NAND produz saída 1 somente quando as duas entradas valem 1.","a porta NOR produz saída 1 quando pelo menos uma das entradas vale 1.","a porta OR produz saída 0 quando pelo menos uma das entradas vale 0.","pelas leis de De Morgan, a negação de (A AND B) equivale a (NOT A) AND (NOT B).","a porta XOR produz saída 1 somente quando as duas entradas têm valores diferentes."],"correta":4,"comentario":"A porta XOR (ou exclusivo) resulta em 1 apenas quando as entradas diferem. A NAND só produz 0 quando ambas valem 1; a NOR só produz 1 quando ambas valem 0; a OR só produz 0 quando ambas valem 0. Por De Morgan, a negação de (A AND B) equivale a (NOT A) OR (NOT B)."},{"id":"fcc-infraestrutura-03","disciplina":"infraestrutura","assunto":"Kubernetes","dificuldade":2,"enunciado":"No Kubernetes, plataforma de orquestração de contêineres, é correto afirmar que","alternativas":["o Service é a máquina física ou virtual do cluster na qual os contêineres são efetivamente executados.","o Deployment expõe um conjunto de Pods na rede por meio de um endereço IP e de um nome DNS estáveis.","o nó (Node) é o objeto que mantém a quantidade desejada de réplicas de um Pod e controla suas atualizações.","o Pod é a menor unidade implantável e reúne um ou mais contêineres com rede e armazenamento compartilhados.","o Pod é o componente do plano de controle que escolhe o nó em que cada contêiner será executado."],"correta":3,"comentario":"O Pod é a menor unidade implantável do Kubernetes e agrupa um ou mais contêineres com rede e volumes compartilhados. O nó é a máquina que executa os Pods, o Deployment gerencia réplicas e atualizações, e o Service oferece um ponto de acesso estável aos Pods. Quem escolhe o nó é o scheduler."},{"id":"fcc-infraestrutura-04","disciplina":"infraestrutura","assunto":"Infraestrutura como código","dificuldade":2,"enunciado":"Sobre as ferramentas de infraestrutura como código Terraform e Ansible, é correto afirmar que","alternativas":["o Ansible dispensa agentes nos servidores gerenciados e descreve as tarefas em playbooks escritos em YAML.","o Terraform exige um agente instalado em cada servidor gerenciado e descreve a infraestrutura em playbooks YAML.","o Ansible registra em um arquivo de estado (tfstate) os recursos que provisionou nos provedores de nuvem.","o Terraform adota abordagem imperativa, em que cada passo do provisionamento é programado em Python.","o comando terraform plan aplica as alterações na infraestrutura sem exibir previamente o que será modificado."],"correta":0,"comentario":"O Ansible é agentless: conecta-se aos servidores, em geral por SSH, e executa tarefas descritas em playbooks YAML. O Terraform é declarativo, usa a linguagem HCL e mantém um arquivo de estado. O comando terraform plan apenas mostra as mudanças previstas; quem as aplica é o terraform apply."},{"id":"fcc-infraestrutura-05","disciplina":"infraestrutura","assunto":"Mensageria: filas x pub/sub","dificuldade":2,"enunciado":"Sobre sistemas de mensageria e seus modelos de comunicação, é correto afirmar que","alternativas":["no modelo de fila ponto a ponto, cada mensagem é entregue a todos os consumidores conectados à fila.","no Apache Kafka, a mensagem é apagada do tópico assim que o primeiro consumidor realiza sua leitura.","no modelo publish/subscribe, a mensagem publicada em um tópico é entregue a todos os seus assinantes.","o RabbitMQ é um banco de dados relacional usado para persistir as mensagens trocadas entre aplicações.","a mensageria exige que produtor e consumidor estejam ativos ao mesmo tempo, em comunicação síncrona."],"correta":2,"comentario":"No publish/subscribe, todos os assinantes de um tópico recebem cada mensagem; na fila ponto a ponto, cada mensagem é consumida por um único consumidor. O Kafka retém as mensagens no log conforme a política de retenção. O RabbitMQ é um broker de mensagens, e a mensageria desacopla as partes no tempo."},{"id":"fcc-infraestrutura-06","disciplina":"infraestrutura","assunto":"Lei de Amdahl","dificuldade":3,"enunciado":"Considere um programa em que 80% do tempo de execução corresponde a um trecho que pode ser paralelizado, sendo o restante estritamente sequencial. De acordo com a lei de Amdahl, ao executar esse programa com 4 processadores, o ganho de desempenho (speedup) em relação à execução com 1 processador é de","alternativas":["1,25 vez.","2,5 vezes.","3,2 vezes.","4 vezes.","5 vezes."],"correta":1,"comentario":"Pela lei de Amdahl, speedup = 1 / ((1 - p) + p / n). Com p = 0,8 e n = 4: 1 / (0,2 + 0,2) = 2,5. A parte sequencial limita o ganho: mesmo com infinitos processadores, o speedup máximo seria 1 / 0,2 = 5."}]`),cesgranrio:JSON.parse('[{"id":"cesgranrio-redes-01","disciplina":"redes","assunto":"IPv6","dificuldade":2,"enunciado":"O endereço IPv6 2001:0DB8:0000:0000:0000:00A0:0000:0001 deve ser escrito em forma abreviada, com a supressão dos zeros à esquerda de cada grupo e a substituição de uma sequência de grupos nulos por dois-pontos duplos. Uma representação válida e equivalente a esse endereço é:","alternativas":["2001:DB8::A0::1","2001:DB8::A:0:1","2001:DB8::A0:0:1","2001:DB8::A0:1","2001:DB8:0:A0:0:1"],"correta":2,"comentario":"Zeros à esquerda de cada grupo podem ser omitidos (0DB8 vira DB8, 00A0 vira A0) e uma única sequência de grupos nulos pode ser trocada por \'::\'. Usar \'::\' duas vezes torna o endereço ambíguo, e zeros à direita, como o de A0, não podem ser removidos."},{"id":"cesgranrio-redes-02","disciplina":"redes","assunto":"BGP e sistemas autônomos","dificuldade":2,"enunciado":"Um roteador de borda do sistema autônomo 65010 recebe, de um vizinho eBGP, o anúncio de um prefixo cujo atributo AS_PATH contém a sequência 65020 65030 65010. De acordo com o funcionamento padrão do BGP, o roteador deve:","alternativas":["descartar o anúncio, pois a presença do próprio AS no AS_PATH indica um laço de roteamento","aceitar o anúncio e preferi-lo aos demais, pois o AS_PATH mais longo tem maior prioridade","aceitar o anúncio e acrescentar novamente o número 65010 ao final do AS_PATH","aceitar o anúncio somente se o atributo MED do prefixo for igual a zero","converter o anúncio em rota iBGP e devolvê-lo ao vizinho que o enviou"],"correta":0,"comentario":"O BGP é um protocolo de vetor de caminhos: cada AS acrescenta seu número ao AS_PATH ao anunciar um prefixo a outro AS. Se o roteador encontra o próprio AS nesse atributo, o anúncio já passou por seu AS e é descartado, o que evita laços entre sistemas autônomos."},{"id":"cesgranrio-redes-03","disciplina":"redes","assunto":"HTTP: métodos e códigos de status","dificuldade":1,"enunciado":"Um recurso antes disponível em /relatorios passou a ser atendido, de forma definitiva, em outra URL. Ao receber uma requisição GET para o caminho antigo, o servidor HTTP deve indicar a nova localização no cabeçalho Location e responder com o código de status:","alternativas":["302 (Found)","304 (Not Modified)","404 (Not Found)","503 (Service Unavailable)","301 (Moved Permanently)"],"correta":4,"comentario":"Códigos 3xx indicam redirecionamento. O 301 informa que o recurso mudou de forma permanente para a URL do cabeçalho Location. O 302 indica mudança temporária, o 304 trata de cache (conteúdo não modificado), o 404 é erro do cliente e o 503, erro do servidor."},{"id":"cesgranrio-redes-04","disciplina":"redes","assunto":"QoS e DiffServ","dificuldade":3,"enunciado":"Na arquitetura DiffServ, os 6 bits mais significativos do byte DS do cabeçalho IPv4 (antigo campo ToS) formam o DSCP, e os 2 bits restantes são usados pelo ECN. Um analisador de pacotes exibe o byte DS de um pacote de voz com o valor hexadecimal B8. O valor decimal do DSCP desse pacote é:","alternativas":["184","46","56","23","5"],"correta":1,"comentario":"B8 em binário é 10111000. Os 6 bits mais significativos, 101110, valem 32 + 8 + 4 + 2 = 46, que é o DSCP do PHB Expedited Forwarding (EF), usado para voz. O valor 184 é o byte inteiro, e 5 corresponde apenas aos 3 bits da antiga precedência IP."},{"id":"cesgranrio-redes-05","disciplina":"redes","assunto":"Modelo TCP/IP x OSI","dificuldade":1,"enunciado":"No modelo TCP/IP de quatro camadas, o protocolo IP opera na camada de internet (inter-rede). No modelo de referência OSI, a camada correspondente e a unidade de dados de protocolo nela tratada são, respectivamente:","alternativas":["enlace e quadro","transporte e segmento","rede e quadro","rede e pacote","transporte e pacote"],"correta":3,"comentario":"A camada de internet do TCP/IP equivale à camada de rede (camada 3) do OSI, responsável pelo endereçamento lógico e pelo roteamento, cuja unidade de dados é o pacote (datagrama). Quadro é a unidade da camada de enlace, e segmento, a da camada de transporte."},{"id":"cesgranrio-redes-06","disciplina":"redes","assunto":"HTTP/2 e HTTP/3 (QUIC)","dificuldade":2,"enunciado":"Uma aplicação web usa HTTP/2 e multiplexa várias requisições em uma única conexão TCP. Em redes com perda de pacotes, a perda de um único segmento paralisa todos os fluxos até a retransmissão. A adoção do HTTP/3 reduz esse problema porque esse protocolo:","alternativas":["usa QUIC sobre UDP, com fluxos independentes: a perda em um fluxo não bloqueia os demais","abre uma conexão TCP distinta para cada requisição, como ocorria no HTTP/1.0","dispensa a criptografia, o que elimina a retransmissão dos segmentos perdidos","substitui a multiplexação de fluxos pelo pipelining de requisições sobre TCP","usa SCTP no lugar do TCP e mantém o TLS 1.2 como uma camada separada"],"correta":0,"comentario":"O HTTP/2 multiplexa fluxos sobre uma única conexão TCP e por isso sofre bloqueio de cabeça de fila (head-of-line blocking) no transporte. O HTTP/3 roda sobre QUIC, que usa UDP, integra o TLS 1.3 e trata a entrega de cada fluxo de forma independente."},{"id":"cesgranrio-seguranca-01","disciplina":"seguranca","assunto":"Funções de hash","dificuldade":1,"enunciado":"Um sistema de arquivamento calcula o resumo SHA-256 de um arquivo de 1 KB e de outro de 4 GB e exibe os dois resumos em notação hexadecimal. O número de dígitos hexadecimais de cada resumo é, respectivamente:","alternativas":["32 e 32","256 e 256","64 e 256","64 e 64","32 e 64"],"correta":3,"comentario":"Funções de hash produzem saída de tamanho fixo, qualquer que seja o tamanho da entrada. O SHA-256 gera sempre 256 bits e, como cada dígito hexadecimal representa 4 bits, o resumo tem 256 / 4 = 64 dígitos nos dois casos."},{"id":"cesgranrio-seguranca-02","disciplina":"seguranca","assunto":"IDS e IPS","dificuldade":1,"enunciado":"Uma empresa conectou um sensor a uma porta espelhada (SPAN) do switch central. O equipamento analisa uma cópia do tráfego, compara os pacotes com assinaturas de ataques conhecidos e gera alertas, mas não tem como descartar pacotes em trânsito. Esse equipamento é um:","alternativas":["IPS de rede (NIPS), em modo inline","IDS de rede (NIDS), em modo passivo","IDS de host (HIDS), instalado em cada servidor","firewall de filtro de pacotes sem estado","honeypot de alta interatividade"],"correta":1,"comentario":"O IDS monitora e alerta, mas não bloqueia: por receber apenas uma cópia do tráfego, fica fora do caminho dos pacotes. O IPS é posicionado inline e pode descartar o tráfego malicioso. Como o sensor observa a rede, e não um host específico, é um NIDS."},{"id":"cesgranrio-seguranca-03","disciplina":"seguranca","assunto":"XSS e CSRF","dificuldade":2,"enunciado":"Um usuário autenticado no site de seu banco abre, em outra aba, uma página maliciosa. Essa página envia automaticamente ao banco um formulário oculto de transferência, e o navegador anexa o cookie de sessão válido, de modo que a operação é aceita. O ataque descrito e uma contramedida adequada são, respectivamente:","alternativas":["CSRF e exigência de token anti-CSRF imprevisível nas requisições que alteram estado","CSRF e marcação do cookie de sessão com o atributo HttpOnly","XSS armazenado e codificação da saída (output encoding) exibida ao usuário","XSS refletido e validação dos parâmetros recebidos na URL da requisição","injeção de SQL e uso de consultas parametrizadas no acesso ao banco de dados"],"correta":0,"comentario":"No CSRF, o atacante induz o navegador da vítima autenticada a enviar uma requisição forjada, aproveitando o envio automático do cookie. O token anti-CSRF (ou o atributo SameSite) impede a falsificação. O HttpOnly só impede a leitura do cookie por scripts, o que mitiga efeitos de XSS."},{"id":"cesgranrio-seguranca-04","disciplina":"seguranca","assunto":"Continuidade de negócios (RPO e RTO)","dificuldade":2,"enunciado":"O plano de continuidade de um sistema define RPO de 8 horas e RTO de 6 horas. O único backup diário é concluído às 2h. Em certo dia, uma falha ocorreu às 14h, e o serviço foi restabelecido às 18h, com os dados restaurados a partir do backup daquele dia. Nesse incidente:","alternativas":["o RPO foi atendido, mas o RTO foi violado","tanto o RPO quanto o RTO foram atendidos","tanto o RPO quanto o RTO foram violados","nem o RPO nem o RTO podem ser avaliados sem o MTBF do sistema","o RTO foi atendido, mas o RPO foi violado"],"correta":4,"comentario":"O RPO limita a perda de dados: perderam-se 12 horas de dados (das 2h às 14h), acima das 8 horas toleradas. O RTO limita o tempo de indisponibilidade: o serviço voltou em 4 horas (das 14h às 18h), dentro das 6 horas definidas."},{"id":"cesgranrio-seguranca-05","disciplina":"seguranca","assunto":"VPN e IPsec","dificuldade":3,"enunciado":"Dois servidores precisam trocar pacotes com proteção IPsec fim a fim que garanta integridade e autenticação da origem, cobrindo inclusive os campos imutáveis do cabeçalho IP original. Não se exige confidencialidade, e não deve ser criado um novo cabeçalho IP. A configuração que atende a esses requisitos é:","alternativas":["AH em modo túnel","ESP em modo transporte","AH em modo transporte","ESP em modo túnel","ESP com cifra nula em modo túnel"],"correta":2,"comentario":"O AH oferece integridade e autenticação da origem, sem cifrar, e seu cálculo cobre os campos imutáveis do cabeçalho IP. O ESP, em modo transporte, não protege o cabeçalho IP. O modo transporte mantém o cabeçalho original, enquanto o modo túnel encapsula o pacote em um novo cabeçalho IP."},{"id":"cesgranrio-seguranca-06","disciplina":"seguranca","assunto":"SIEM e resposta a incidentes","dificuldade":2,"enunciado":"O SIEM de uma organização correlacionou eventos de vários servidores e alertou sobre a ação de um ransomware em um servidor de arquivos. Confirmado o incidente, a equipe de resposta desconectou imediatamente o servidor da rede para impedir a propagação, antes de remover o malware e restaurar os dados. Essa ação pertence à etapa de:","alternativas":["erradicação","recuperação","preparação","lições aprendidas","contenção"],"correta":4,"comentario":"Contenção é a etapa que limita o alcance do incidente, por exemplo isolando o ativo comprometido. A erradicação remove a causa (o malware), a recuperação restaura sistemas e dados, a preparação ocorre antes do incidente e as lições aprendidas vêm depois de seu encerramento."},{"id":"cesgranrio-banco-de-dados-01","disciplina":"banco-de-dados","assunto":"SQL: GROUP BY e HAVING","dificuldade":2,"enunciado":"A tabela VENDA(id, vendedor, valor) contém as linhas (1, \'Ana\', 100), (2, \'Ana\', 300), (3, \'Bia\', 500), (4, \'Caio\', 150), (5, \'Caio\', 50) e (6, \'Caio\', 200). Considere a consulta:\\n```\\nSELECT vendedor, SUM(valor) AS total\\nFROM VENDA\\nWHERE valor >= 100\\nGROUP BY vendedor\\nHAVING COUNT(*) >= 2\\n```\\nO resultado é composto pelas linhas:","alternativas":["(Ana, 400) e (Caio, 400)","(Ana, 400) e (Caio, 350)","(Ana, 400), (Bia, 500) e (Caio, 350)","(Ana, 400), (Bia, 500) e (Caio, 400)","(Caio, 400), apenas"],"correta":1,"comentario":"O WHERE filtra as linhas antes do agrupamento e elimina a venda de 50. Restam Ana (100 e 300), Bia (500) e Caio (150 e 200). O HAVING filtra os grupos já formados e mantém apenas os que têm 2 ou mais linhas: Ana, com total 400, e Caio, com total 350."},{"id":"cesgranrio-banco-de-dados-02","disciplina":"banco-de-dados","assunto":"Controle de concorrência (2PL)","dificuldade":3,"enunciado":"Considere as operações lock-S (bloqueio compartilhado), lock-X (bloqueio exclusivo) e unlock (liberação do bloqueio) sobre os itens de dados A, B e C. A sequência de operações de uma transação que obedece ao protocolo de bloqueio em duas fases (2PL) é:","alternativas":["lock-S(A); read(A); unlock(A); lock-X(B); write(B); unlock(B)","lock-X(B); write(B); unlock(B); lock-S(A); read(A); unlock(A)","lock-S(A); read(A); lock-X(B); unlock(A); lock-X(C); write(C); unlock(B); unlock(C)","lock-S(A); read(A); lock-X(B); unlock(A); write(B); unlock(B)","lock-X(B); write(B); lock-S(A); unlock(B); read(A); lock-S(C); unlock(A); unlock(C)"],"correta":3,"comentario":"No 2PL, a transação tem uma fase de expansão, em que só adquire bloqueios, e uma fase de encolhimento, em que só os libera. Depois do primeiro unlock, nenhum novo bloqueio pode ser obtido. Apenas a sequência que bloqueia A e B antes de liberar qualquer item respeita essa regra."},{"id":"cesgranrio-banco-de-dados-03","disciplina":"banco-de-dados","assunto":"Triggers e stored procedures","dificuldade":2,"enunciado":"Em um SGBD que segue o padrão SQL, a tabela CONTA possui dois triggers AFTER UPDATE: o primeiro foi criado com a cláusula FOR EACH ROW, e o segundo, com FOR EACH STATEMENT. Um único comando UPDATE altera 5 linhas dessa tabela. O número de disparos do primeiro e do segundo trigger é, respectivamente:","alternativas":["1 e 5","5 e 5","5 e 1","1 e 1","0 e 1"],"correta":2,"comentario":"Um trigger de linha (FOR EACH ROW) dispara uma vez para cada linha afetada pelo comando: 5 vezes. Um trigger de comando (FOR EACH STATEMENT) dispara uma única vez por instrução. Nos dois casos o disparo é automático, ao contrário da stored procedure, que precisa ser chamada."},{"id":"cesgranrio-banco-de-dados-04","disciplina":"banco-de-dados","assunto":"ETL, Data Lake e Data Mart","dificuldade":1,"enunciado":"Uma empresa passou a guardar em um repositório central grandes volumes de dados em formato bruto e nativo, como logs, arquivos JSON, imagens e tabelas exportadas, sem definir previamente um esquema: a estrutura só é aplicada no momento da leitura (schema-on-read). Esse repositório é um:","alternativas":["Data Lake","Data Mart","Data Warehouse","cubo OLAP","banco de dados operacional (OLTP)"],"correta":0,"comentario":"O Data Lake armazena dados brutos, estruturados ou não, e adia a definição do esquema para a leitura. O Data Warehouse guarda dados já tratados por ETL, em esquema definido na escrita, e o Data Mart é um subconjunto do DW voltado a um departamento ou assunto."},{"id":"cesgranrio-banco-de-dados-05","disciplina":"banco-de-dados","assunto":"SQL: DCL e DTL","dificuldade":2,"enunciado":"A tabela T, com uma única coluna inteira, está vazia. Em uma sessão, é executada a sequência de comandos:\\n```\\nBEGIN;\\nINSERT INTO T VALUES (1);\\nSAVEPOINT s1;\\nINSERT INTO T VALUES (2);\\nROLLBACK TO SAVEPOINT s1;\\nINSERT INTO T VALUES (3);\\nCOMMIT;\\n```\\nApós a execução, a tabela T contém:","alternativas":["os valores 1, 2 e 3","apenas o valor 1","apenas o valor 3","nenhuma linha","os valores 1 e 3"],"correta":4,"comentario":"O ROLLBACK TO SAVEPOINT desfaz somente o que foi executado depois do ponto de salvamento s1, ou seja, a inserção do valor 2, e mantém a transação aberta. A inserção anterior (1) e a posterior (3) são efetivadas pelo COMMIT."},{"id":"cesgranrio-banco-de-dados-06","disciplina":"banco-de-dados","assunto":"SGBD e dicionário de dados","dificuldade":1,"enunciado":"Um administrador precisa consultar quais tabelas, colunas, tipos de dados, restrições e privilégios estão definidos em um banco de dados. Essas descrições, que são dados sobre os dados (metadados), são mantidas pelo próprio SGBD:","alternativas":["no log de transações (journal)","no buffer de dados em memória (buffer pool)","no dicionário de dados (catálogo do sistema)","no espaço de tabelas temporárias","no plano de execução das consultas"],"correta":2,"comentario":"O dicionário de dados, ou catálogo, armazena os metadados: definições de tabelas, colunas, restrições, índices, usuários e privilégios. O log registra alterações para fins de recuperação, e o buffer mantém em memória páginas de dados lidas do disco."},{"id":"cesgranrio-engenharia-de-software-01","disciplina":"engenharia-de-software","assunto":"Extreme Programming (XP)","dificuldade":1,"enunciado":"Em uma equipe que adota Extreme Programming (XP), todo código de produção é escrito por dois desenvolvedores que compartilham a mesma estação de trabalho: um digita enquanto o outro revisa continuamente e sugere melhorias, com troca frequente de papéis. Essa prática é denominada:","alternativas":["propriedade coletiva do código","integração contínua","jogo do planejamento","cliente presente (on-site customer)","programação em pares"],"correta":4,"comentario":"Na programação em pares, dois desenvolvedores produzem juntos o mesmo código, o que equivale a uma revisão contínua. Propriedade coletiva significa que qualquer membro pode alterar qualquer parte do código, e integração contínua é integrar e testar o código várias vezes ao dia."},{"id":"cesgranrio-engenharia-de-software-02","disciplina":"engenharia-de-software","assunto":"Níveis de teste","dificuldade":1,"enunciado":"Os módulos de cadastro e de cobrança de um sistema foram testados isoladamente por seus desenvolvedores. Em seguida, a equipe passou a verificar se as interfaces e a troca de dados entre esses módulos funcionam corretamente quando eles são combinados. Esse nível de teste é o de:","alternativas":["integração","unidade","sistema","aceitação","regressão"],"correta":0,"comentario":"O teste de integração verifica a interação entre componentes já testados isoladamente no teste de unidade. O teste de sistema avalia o produto completo frente aos requisitos, e o de aceitação é conduzido com o cliente ou usuário para validar a entrega."},{"id":"cesgranrio-engenharia-de-software-03","disciplina":"engenharia-de-software","assunto":"Padrões GoF comportamentais","dificuldade":3,"enunciado":"Considere a classe Java a seguir, em que abrir e fechar são métodos concretos da própria classe, omitidos por brevidade:\\n```\\nabstract class Importador {\\n  final void importar() {\\n    abrir(); ler(); validar(); fechar();\\n  }\\n  abstract void ler();\\n  abstract void validar();\\n}\\n```\\nAs subclasses ImportadorCSV e ImportadorXML implementam apenas ler e validar. O padrão de projeto comportamental aplicado é o:","alternativas":["Strategy","State","Command","Template Method","Chain of Responsibility"],"correta":3,"comentario":"O Template Method define em uma superclasse o esqueleto de um algoritmo (o método importar) e delega às subclasses, por herança, a implementação de alguns passos. O Strategy também varia algoritmos, mas por composição, encapsulando cada um em um objeto separado."},{"id":"cesgranrio-engenharia-de-software-04","disciplina":"engenharia-de-software","assunto":"DevOps e CI/CD","dificuldade":2,"enunciado":"Em um pipeline, cada commit na branch principal dispara a compilação e os testes automatizados. Quando todas as etapas são aprovadas, a nova versão é publicada em produção automaticamente, sem qualquer aprovação manual. Essa prática é denominada:","alternativas":["entrega contínua (continuous delivery)","implantação contínua (continuous deployment)","integração contínua (continuous integration)","infraestrutura como código (IaC)","implantação azul-verde (blue-green deployment)"],"correta":1,"comentario":"Na implantação contínua, toda alteração aprovada no pipeline vai automaticamente para produção. Na entrega contínua, o software fica sempre pronto para liberação, mas a publicação em produção depende de decisão manual. A integração contínua cobre apenas a integração, o build e os testes."},{"id":"cesgranrio-engenharia-de-software-05","disciplina":"engenharia-de-software","assunto":"Refatoração e code smells","dificuldade":2,"enunciado":"Um método com cerca de 200 linhas valida os dados de um pedido, calcula os impostos e monta o texto de um relatório. A equipe quer torná-lo mais legível e fácil de manter, sem alterar o comportamento externo do sistema. O code smell presente e a refatoração indicada são, respectivamente:","alternativas":["Long Method (método longo) e Inline Method (internalizar método)","Lazy Class (classe ociosa) e Inline Class (internalizar classe)","Long Method (método longo) e Extract Method (extrair método)","Feature Envy (inveja de recursos) e Move Method (mover método)","Shotgun Surgery (cirurgia com espingarda) e Pull Up Method (subir método)"],"correta":2,"comentario":"Um método extenso, que acumula várias responsabilidades, caracteriza o smell Long Method. A refatoração Extract Method move trechos coesos para métodos menores e bem nomeados, preservando o comportamento. O Inline Method faz o oposto: incorpora o corpo de um método em quem o chama."},{"id":"cesgranrio-engenharia-de-software-06","disciplina":"engenharia-de-software","assunto":"Histórias de usuário e INVEST","dificuldade":2,"enunciado":"No refinamento do backlog, o Product Owner apresenta a história: \'Como cliente, quero que o sistema seja rápido, para não perder tempo\'. A equipe considera que não há como verificar objetivamente quando a história estará concluída. O atributo do INVEST que não foi atendido e a ação adequada são, respectivamente:","alternativas":["Pequena (Small): dividir a história em tarefas técnicas de banco e de interface","Independente (Independent): fundir a história com as demais do mesmo épico","Negociável (Negotiable): fixar no texto da história a solução técnica a adotar","Testável (Testable): acrescentar critérios de aceitação objetivos e mensuráveis","Valiosa (Valuable): remover a história do backlog por não gerar valor ao cliente"],"correta":3,"comentario":"No INVEST, uma história deve ser independente, negociável, valiosa, estimável, pequena e testável. \'Ser rápido\' é vago demais para ser verificado. Critérios de aceitação mensuráveis, como responder a uma busca em até 2 segundos, tornam a história testável."},{"id":"cesgranrio-sistemas-operacionais-01","disciplina":"sistemas-operacionais","assunto":"Deadlock","dificuldade":3,"enunciado":"Um sistema possui 10 instâncias de um único tipo de recurso e três processos. P1 detém 2 instâncias e pode precisar de até 6; P2 detém 3 e pode precisar de até 5; P3 detém 2 e pode precisar de até 9. Aplicando-se o algoritmo do banqueiro a esse estado, conclui-se que ele é:","alternativas":["seguro, e a única sequência segura é P2, P1, P3","seguro, e uma sequência segura é P1, P2, P3","seguro, e uma sequência segura é P2, P3, P1","inseguro, pois nenhum processo consegue terminar com as 3 instâncias livres","inseguro, pois a soma das necessidades máximas (20) supera as 10 instâncias"],"correta":0,"comentario":"Há 10 - 7 = 3 instâncias livres, e as necessidades restantes são 4 (P1), 2 (P2) e 7 (P3). Só P2 pode terminar primeiro, o que deixa 6 instâncias livres. Então P1 termina e deixa 8 livres, o bastante para P3. Existe, portanto, uma sequência segura: P2, P1, P3."},{"id":"cesgranrio-sistemas-operacionais-02","disciplina":"sistemas-operacionais","assunto":"Sistemas de arquivos","dificuldade":2,"enunciado":"Em um sistema de arquivos ext4, o arquivo relatorio.txt possui um único nome. Um administrador executa os comandos:\\n```\\nln relatorio.txt copia.txt\\nrm relatorio.txt\\n```\\nApós a execução dos dois comandos:","alternativas":["copia.txt torna-se um link quebrado, pois guardava apenas o caminho de relatorio.txt","os dados são apagados, pois o inode pertence ao primeiro nome criado para o arquivo","os dados continuam acessíveis por copia.txt, pois os dois nomes referenciavam o mesmo inode","o comando rm falha, pois não é possível remover um arquivo que possui outro nome","copia.txt passa a apontar para um novo inode, com uma cópia independente dos dados"],"correta":2,"comentario":"O comando ln sem a opção -s cria um hard link: outra entrada de diretório para o mesmo inode, cujo contador de links passa a 2. O rm remove apenas um nome e decrementa o contador, e os blocos só são liberados quando ele chega a zero. Link quebrado ocorreria com um link simbólico."},{"id":"cesgranrio-sistemas-operacionais-03","disciplina":"sistemas-operacionais","assunto":"Windows Server: Active Directory","dificuldade":1,"enunciado":"Em um domínio Active Directory, as contas dos usuários do setor financeiro estão reunidas em uma unidade organizacional (OU). O administrador deseja que, para todos esses usuários, o acesso ao Painel de Controle seja bloqueado e um papel de parede padrão seja aplicado automaticamente no logon. Para isso, ele deve:","alternativas":["criar uma relação de confiança entre o domínio e a OU","promover as estações do setor a controladores de domínio","incluir as contas do setor no catálogo global da floresta","criar uma nova floresta exclusiva para o setor financeiro","criar um objeto de política de grupo (GPO) e vinculá-lo à OU"],"correta":4,"comentario":"As diretivas de grupo (GPOs) centralizam configurações de usuários e computadores e podem ser vinculadas a sites, domínios ou OUs, aplicando-se aos objetos neles contidos. Relações de confiança ligam domínios ou florestas, e o catálogo global serve para buscas em toda a floresta."},{"id":"cesgranrio-sistemas-operacionais-04","disciplina":"sistemas-operacionais","assunto":"Gerência de E/S","dificuldade":1,"enunciado":"Vários processos enviam documentos a uma única impressora. Para evitar que as saídas se misturem e que os processos fiquem bloqueados à espera do dispositivo, o sistema operacional grava cada trabalho em uma área de disco, e um processo dedicado os envia à impressora, um por vez. Essa técnica é denominada:","alternativas":["acesso direto à memória (DMA)","spooling","swapping","E/S programada com espera ocupada (polling)","paginação por demanda"],"correta":1,"comentario":"No spooling, as saídas destinadas a um dispositivo dedicado, como a impressora, são gravadas em uma área intermediária em disco e despachadas em sequência por um processo do sistema. O DMA transfere blocos entre o dispositivo e a memória sem que a CPU intervenha em cada byte."},{"id":"cesgranrio-sistemas-operacionais-05","disciplina":"sistemas-operacionais","assunto":"Particionamento, LVM e swap","dificuldade":2,"enunciado":"Em um servidor Linux com LVM, o volume lógico /dev/vg0/dados, formatado com ext4, está cheio, e o grupo de volumes vg0 não tem extensões livres. Um novo disco, /dev/sdc, foi instalado para ampliar esse volume. A ordem correta das operações é:","alternativas":["pvcreate, lvextend, vgextend e, por fim, redimensionamento do sistema de arquivos","lvextend, vgextend, pvcreate e, por fim, redimensionamento do sistema de arquivos","vgcreate, pvcreate, lvcreate e, por fim, formatação do novo volume com mkfs","pvcreate, vgextend, lvextend e, por fim, redimensionamento do sistema de arquivos","mkswap, swapon, lvextend e, por fim, redimensionamento do sistema de arquivos"],"correta":3,"comentario":"No LVM, o disco é primeiro inicializado como volume físico (pvcreate) e depois incorporado ao grupo de volumes (vgextend), cujo espaço novo é então atribuído ao volume lógico (lvextend). Por último, o sistema de arquivos é redimensionado (resize2fs, no ext4) para ocupar o espaço."},{"id":"cesgranrio-sistemas-operacionais-06","disciplina":"sistemas-operacionais","assunto":"Métodos de alocação de arquivos","dificuldade":2,"enunciado":"Um sistema de arquivos usa alocação indexada com um único bloco de índice por arquivo, sem níveis adicionais de indireção. Os blocos têm 1 KB (1.024 bytes), e cada ponteiro de bloco ocupa 4 bytes. O tamanho máximo de um arquivo nesse sistema é:","alternativas":["1.024 KB","256 KB","4 KB","250 KB","4.096 KB"],"correta":1,"comentario":"O bloco de índice comporta 1.024 / 4 = 256 ponteiros, e cada um referencia um bloco de dados de 1 KB, o que limita o arquivo a 256 KB. A alocação indexada permite acesso direto sem fragmentação externa, ao custo do espaço ocupado pelos blocos de índice."},{"id":"cesgranrio-programacao-01","disciplina":"programacao","assunto":"Árvores binárias de busca e percursos","dificuldade":2,"enunciado":"As chaves 40, 20, 60, 10, 30, 50 e 25 são inseridas, nessa ordem, em uma árvore binária de busca inicialmente vazia, sem balanceamento. A sequência de chaves obtida no percurso em pós-ordem dessa árvore é:","alternativas":["40, 20, 10, 30, 25, 60, 50","10, 20, 25, 30, 40, 50, 60","40, 20, 60, 10, 30, 50, 25","10, 25, 30, 20, 50, 60, 40","25, 10, 30, 20, 50, 60, 40"],"correta":3,"comentario":"A raiz é 40, com 20 à esquerda (filhos 10 e 30, e 25 à esquerda de 30) e 60 à direita (filho esquerdo 50). A pós-ordem visita a subárvore esquerda, depois a direita e, por último, a raiz: 10, 25, 30, 20, 50, 60, 40. A sequência crescente é a do percurso em ordem."},{"id":"cesgranrio-programacao-02","disciplina":"programacao","assunto":"Quicksort, mergesort e heapsort","dificuldade":2,"enunciado":"Um sistema precisa ordenar registros de clientes por data de cadastro, com duas exigências: o tempo de execução deve ser O(n log n) mesmo no pior caso, e registros com a mesma data devem manter a ordem relativa que tinham na entrada (ordenação estável). Entre os algoritmos a seguir, em suas implementações clássicas, o que atende a ambas é o:","alternativas":["quicksort","heapsort","insertion sort","selection sort","mergesort"],"correta":4,"comentario":"O mergesort tem custo O(n log n) em qualquer caso e é estável. O quicksort degrada para O(n²) no pior caso e não é estável, o heapsort garante O(n log n), mas não é estável, e os métodos de inserção e de seleção são O(n²) no pior caso."},{"id":"cesgranrio-programacao-03","disciplina":"programacao","assunto":"Java: coleções","dificuldade":1,"enunciado":"Considere o trecho de código Java, com as importações de java.util já realizadas:\\n```\\nSet<Integer> s = new HashSet<>();\\ns.add(3); s.add(1); s.add(3); s.add(2);\\nList<Integer> l = new ArrayList<>();\\nl.add(3); l.add(1); l.add(3); l.add(2);\\nSystem.out.print(s.size() + \\" \\" + l.size());\\n```\\nA saída produzida é:","alternativas":["3 4","4 4","3 3","4 3","2 4"],"correta":0,"comentario":"Um Set não admite elementos duplicados: a segunda inserção do 3 é ignorada, e o HashSet fica com 3 elementos. Uma List mantém a ordem
