 de inserção e aceita repetições, de modo que o ArrayList guarda os 4 valores. A saída é 3 4."},{"id":"cesgranrio-programacao-04","disciplina":"programacao","assunto":"HTML e CSS","dificuldade":2,"enunciado":"Uma página HTML contém um único parágrafo (elemento p) com os atributos id=\\"a\\" e class=\\"b\\", e a seguinte folha de estilos:\\n```\\n#a { color: blue; }\\n.b { color: green; }\\np { color: red; }\\n```\\nConsiderando as regras de especificidade do CSS, o texto do parágrafo é exibido na cor:","alternativas":["vermelha, pois a regra declarada por último sempre prevalece","verde, pois o seletor de classe é mais específico que o de id","azul, pois o seletor de id tem a maior especificidade","vermelha, pois o seletor de elemento é o mais específico","preta, pois declarações conflitantes anulam-se mutuamente"],"correta":2,"comentario":"Quando várias regras definem a mesma propriedade, vence a de maior especificidade: o seletor de id supera o de classe, que supera o de elemento. A ordem de declaração só desempata regras de mesma especificidade. Portanto, vale a regra #a, e o texto fica azul."},{"id":"cesgranrio-programacao-05","disciplina":"programacao","assunto":"Caminhos mínimos (Dijkstra)","dificuldade":3,"enunciado":"Um grafo não direcionado tem os vértices A, B, C, D e E e as seguintes arestas, com seus pesos: A-B (4), A-C (2), B-C (1), B-D (5), C-D (8), C-E (10) e D-E (2). Aplicando-se o algoritmo de Dijkstra a partir de A, o caminho de menor custo até E é:","alternativas":["A, B, D, E, com custo 11","A, C, B, D, E, com custo 10","A, C, E, com custo 12","A, C, D, E, com custo 12","A, B, C, E, com custo 15"],"correta":1,"comentario":"A partir de A, C é alcançado com custo 2 e B com custo 3 (via C, melhor que a aresta direta de peso 4). De B chega-se a D com custo 8 e, de D, a E com custo 10. Os caminhos A-C-E (12) e A-B-D-E (11) são mais caros."},{"id":"cesgranrio-programacao-06","disciplina":"programacao","assunto":"ORM e injeção de dependência","dificuldade":1,"enunciado":"Em uma aplicação Java, a classe PedidoService declara em seu construtor um parâmetro do tipo da interface PedidoRepositorio. Em tempo de execução, um contêiner (como o do Spring) cria a implementação concreta e a fornece ao construtor, de modo que a classe não usa o operador new para obtê-la. Essa técnica é denominada:","alternativas":["injeção de dependência","mapeamento objeto-relacional","sobrecarga de construtores","carregamento tardio (lazy loading)","serialização de objetos"],"correta":0,"comentario":"Na injeção de dependência, uma forma de inversão de controle, o objeto recebe suas dependências de um agente externo em vez de criá-las, o que reduz o acoplamento e facilita os testes. O mapeamento objeto-relacional (ORM) é outra técnica: associa classes a tabelas do banco."},{"id":"cesgranrio-governanca-01","disciplina":"governanca","assunto":"ITIL 4: habilitação de mudança","dificuldade":1,"enunciado":"Uma organização que adota o ITIL 4 trata a instalação de softwares homologados em estações de trabalho como uma mudança de baixo risco, bem compreendida, com procedimento documentado e pré-autorizada, que dispensa nova avaliação a cada solicitação. Na prática de habilitação de mudança, trata-se de uma mudança:","alternativas":["normal","emergencial","padrão","corretiva","evolutiva"],"correta":2,"comentario":"No ITIL 4, mudanças padrão são de baixo risco, pré-autorizadas e seguem procedimento documentado, muitas vezes atendidas como requisições de serviço. Mudanças normais são avaliadas e autorizadas caso a caso, e as emergenciais são implementadas o mais rápido possível, com avaliação acelerada."},{"id":"cesgranrio-governanca-02","disciplina":"governanca","assunto":"Escopo e EAP","dificuldade":1,"enunciado":"Ao criar a estrutura analítica do projeto (EAP), a equipe decompõe as entregas em partes cada vez menores, até chegar ao nível mais baixo da estrutura, no qual o custo e a duração do trabalho podem ser estimados e gerenciados. De acordo com o Guia PMBOK, os componentes desse nível são denominados:","alternativas":["contas de controle","marcos do projeto","atividades do cronograma","linhas de base do escopo","pacotes de trabalho"],"correta":4,"comentario":"O pacote de trabalho é o nível mais baixo da EAP, em que custo e duração podem ser estimados e gerenciados. As atividades resultam da decomposição dos pacotes já no gerenciamento do cronograma, e a conta de controle é um ponto de controle gerencial que agrupa pacotes de trabalho."},{"id":"cesgranrio-governanca-03","disciplina":"governanca","assunto":"Valor agregado","dificuldade":3,"enunciado":"Um projeto tem orçamento total de R$ 200.000,00, com custos planejados de modo uniforme ao longo de 10 meses. Ao fim do mês 4, 30% do trabalho total estava concluído, e o custo real acumulado era de R$ 50.000,00. Nessa data, os índices de desempenho de custos (IDC) e de prazos (IDP) são, respectivamente:","alternativas":["0,75 e 1,20","1,20 e 0,75","0,83 e 0,75","1,20 e 1,33","1,60 e 0,75"],"correta":1,"comentario":"VP = 40% de 200.000 = 80.000, VA = 30% de 200.000 = 60.000 e CR = 50.000. Assim, IDC = VA / CR = 1,20 (gastou-se menos que o valor do trabalho realizado) e IDP = VA / VP = 0,75 (fez-se menos trabalho que o planejado: o projeto está atrasado)."},{"id":"cesgranrio-governanca-04","disciplina":"governanca","assunto":"CMMI (níveis de maturidade)","dificuldade":2,"enunciado":"Em uma organização avaliada segundo a representação por estágios do CMMI, os processos são bem caracterizados, descritos em padrões e procedimentos válidos para toda a organização e adaptados por cada projeto a partir desse conjunto padrão. Ainda não há, porém, controle dos processos por técnicas estatísticas e quantitativas. Essa descrição corresponde ao nível de maturidade:","alternativas":["1 (Inicial)","2 (Gerenciado)","4 (Gerenciado Quantitativamente)","3 (Definido)","5 (Em Otimização)"],"correta":3,"comentario":"No nível 3 (Definido), os processos são padronizados no âmbito da organização e adaptados a cada projeto. No nível 2 (Gerenciado), a gestão ocorre projeto a projeto. O controle estatístico surge no nível 4, e a melhoria contínua baseada nesses dados caracteriza o nível 5."},{"id":"cesgranrio-governanca-05","disciplina":"governanca","assunto":"Governança de dados (DAMA-DMBOK)","dificuldade":2,"enunciado":"Uma empresa mantém cadastros de clientes divergentes em três sistemas e decide criar uma visão única e confiável de cada cliente (registro mestre), a ser compartilhada por todas as aplicações. No DAMA-DMBOK, essa iniciativa pertence à área de conhecimento de:","alternativas":["Gestão de Dados Mestres e de Referência","Data Warehousing e Business Intelligence","Gestão de Metadados","Segurança de Dados","Armazenamento e Operações de Dados"],"correta":0,"comentario":"A área de Dados Mestres e de Referência trata da consolidação das entidades centrais do negócio, como clientes e produtos, em uma versão única e confiável, compartilhada entre os sistemas. Metadados descrevem os dados, e Data Warehousing e BI tratam de dados integrados para análise."},{"id":"cesgranrio-governanca-06","disciplina":"governanca","assunto":"Portfólio, programas, projetos e PMO","dificuldade":2,"enunciado":"Uma empresa gerencia de forma coordenada três projetos inter-relacionados (implantação de um ERP, migração dos dados legados e capacitação dos usuários), para obter benefícios que não teria ao gerenciá-los isoladamente. Além disso, a diretoria seleciona e prioriza, conforme os objetivos estratégicos, todas as iniciativas da empresa, relacionadas ou não entre si. Segundo o Guia PMBOK, esses dois agrupamentos são, respectivamente, um:","alternativas":["portfólio e um programa","programa e um escritório de projetos (PMO)","portfólio e um escritório de projetos (PMO)","subprojeto e um programa","programa e um portfólio"],"correta":4,"comentario":"Programa é um grupo de projetos relacionados, gerenciados de modo coordenado para obter benefícios que não surgiriam isoladamente. Portfólio reúne projetos, programas e operações, relacionados ou não, selecionados e priorizados conforme a estratégia. O PMO é uma estrutura de apoio."},{"id":"cesgranrio-infraestrutura-01","disciplina":"infraestrutura","assunto":"Representação de dados","dificuldade":3,"enunciado":"Um processador representa inteiros com sinal em complemento de dois, usando 8 bits, e soma os valores decimais 100 e 60 sem qualquer tratamento adicional. Considerando apenas os 8 bits do resultado, o valor obtido, interpretado em complemento de dois, é:","alternativas":["160, sem ocorrência de overflow","-96, com ocorrência de overflow","-32, com ocorrência de overflow","127, pois o resultado satura no maior valor","-95, com ocorrência de overflow"],"correta":1,"comentario":"Em 8 bits, o complemento de dois representa de -128 a 127. A soma 100 + 60 = 160 produz o padrão 10100000, cujo bit de sinal é 1. Interpretado em complemento de dois, esse padrão vale 160 - 256 = -96. Como dois positivos geraram um negativo, houve overflow."},{"id":"cesgranrio-infraestrutura-02","disciplina":"infraestrutura","assunto":"Armazenamento: HDD x SSD","dificuldade":1,"enunciado":"Um servidor de banco de dados com intenso acesso aleatório a pequenos blocos teve seus discos rígidos magnéticos (HDD) substituídos por unidades de estado sólido (SSD), o que reduziu muito o tempo de resposta. Esse ganho se explica principalmente porque o SSD:","alternativas":["grava os dados em trilhas mais densas, o que reduz o deslocamento do braço de leitura","gira seus pratos a uma velocidade maior, o que reduz a latência rotacional","suporta um número ilimitado de ciclos de gravação em cada célula de memória","não tem partes mecânicas, o que elimina o tempo de busca e a latência rotacional","dispensa o uso de controladora e de sistema de arquivos para localizar os dados"],"correta":3,"comentario":"O HDD depende do movimento do braço (tempo de busca) e da rotação dos pratos (latência rotacional), custos altos em acessos aleatórios. O SSD usa memória flash, sem partes móveis, e acessa qualquer bloco em tempo quase uniforme. Suas células, porém, suportam número limitado de gravações."},{"id":"cesgranrio-infraestrutura-03","disciplina":"infraestrutura","assunto":"Computação em nuvem: IaaS, PaaS e SaaS","dificuldade":1,"enunciado":"Uma equipe de desenvolvimento contrata um serviço de nuvem no qual apenas publica o código de sua aplicação e configura parâmetros de execução. O provedor é responsável por servidores, sistema operacional, ambiente de execução, middleware e escalabilidade. Esse modelo de serviço é o:","alternativas":["IaaS (infraestrutura como serviço)","SaaS (software como serviço)","PaaS (plataforma como serviço)","DaaS (desktop como serviço)","colocation (hospedagem de equipamentos próprios)"],"correta":2,"comentario":"No PaaS, o cliente gerencia apenas a aplicação e seus dados, e o provedor cuida da plataforma (sistema operacional, runtime e middleware). No IaaS, o cliente recebe máquinas virtuais e administra o sistema operacional. No SaaS, consome uma aplicação pronta."},{"id":"cesgranrio-infraestrutura-04","disciplina":"infraestrutura","assunto":"Monitoramento e observabilidade","dificuldade":2,"enunciado":"Em uma arquitetura de microsserviços, uma requisição do usuário atravessa seis serviços e, em alguns casos, apresenta latência elevada. A equipe precisa acompanhar cada requisição de ponta a ponta, com um identificador propagado entre os serviços, para descobrir em qual deles o tempo é consumido. O recurso de observabilidade adequado a essa necessidade é:","alternativas":["o rastreamento distribuído (tracing), que registra o percurso e a duração de cada etapa","a coleta de métricas, que agrega valores numéricos ao longo do tempo, como o uso de CPU","o registro de logs, que grava eventos discretos gerados isoladamente por cada serviço","a verificação de saúde (health check), que indica se cada serviço está respondendo","o painel (dashboard) de disponibilidade, que exibe o percentual mensal de cada serviço"],"correta":0,"comentario":"Traces acompanham uma requisição por todos os serviços, dividindo-a em spans com duração própria, o que revela onde está a lentidão. Métricas mostram tendências agregadas, e logs detalham eventos pontuais, mas nenhum dos dois reconstrói sozinho o caminho da requisição."},{"id":"cesgranrio-infraestrutura-05","disciplina":"infraestrutura","assunto":"CDN e cache distribuído","dificuldade":2,"enunciado":"Uma aplicação precisa de um cache distribuído em memória que, além de pares chave-valor simples, ofereça estruturas como listas, hashes e conjuntos ordenados (para um ranking de usuários), com opção de persistir os dados em disco e de replicá-los entre nós. Entre as opções a seguir, a que atende a esses requisitos é:","alternativas":["o Memcached","uma rede de distribuição de conteúdo (CDN)","um proxy reverso com cache HTTP","um balanceador de carga baseado em DNS","o Redis"],"correta":4,"comentario":"O Redis é um armazenamento em memória com estruturas de dados ricas (listas, hashes, conjuntos ordenados), persistência opcional e replicação. O Memcached é um cache chave-valor mais simples, sem essas estruturas nem persistência. A CDN distribui conteúdo estático em servidores próximos aos usuários."},{"id":"cesgranrio-infraestrutura-06","disciplina":"infraestrutura","assunto":"Aprendizado de máquina","dificuldade":2,"enunciado":"Um banco dispõe de um histórico de transações em que cada registro já está rotulado como \'fraude\' ou \'legítima\' e pretende treinar um modelo capaz de atribuir um desses rótulos a novas transações. O tipo de aprendizado de máquina e a tarefa envolvidos são, respectivamente:","alternativas":["supervisionado e regressão","não supervisionado e agrupamento (clustering)","supervisionado e classificação","não supervisionado e redução de dimensionalidade","por reforço e maximização de recompensa"],"correta":2,"comentario":"Há dados rotulados, o que caracteriza aprendizado supervisionado, e a saída é uma categoria discreta (fraude ou legítima), o que define uma tarefa de classificação. A regressão prevê valores numéricos contínuos, e o agrupamento busca grupos em dados sem rótulos."}]'),vunesp:JSON.parse('[{"id":"vunesp-redes-01","disciplina":"redes","assunto":"DNS (registros e resolução)","dificuldade":1,"enunciado":"No serviço DNS, assinale a alternativa que apresenta o tipo de registro de recurso que indica os servidores de correio eletrônico responsáveis por receber as mensagens destinadas a um domínio.","alternativas":["AAAA","CNAME","MX","NS","PTR"],"correta":2,"comentario":"O registro MX (Mail Exchanger) indica os servidores de correio do domínio, cada um com um valor de preferência. O AAAA mapeia nome para endereço IPv6, o CNAME define um apelido, o NS aponta os servidores de nomes autoritativos e o PTR é usado na resolução reversa."},{"id":"vunesp-redes-02","disciplina":"redes","assunto":"VLANs e IEEE 802.1Q","dificuldade":2,"enunciado":"No contexto de VLANs e do padrão IEEE 802.1Q, é correto afirmar que","alternativas":["a marcação (tag) 802.1Q inserida no quadro Ethernet contém um identificador de VLAN de 12 bits.","todas as VLANs configuradas em um mesmo switch compartilham um único domínio de broadcast.","a comunicação entre VLANs distintas dispensa roteador ou qualquer outra função de camada 3.","uma porta de acesso (access) transporta quadros marcados de várias VLANs ao mesmo tempo.","a marcação 802.1Q encapsula o quadro original em um novo cabeçalho IP, que carrega o número da VLAN."],"correta":0,"comentario":"O 802.1Q insere no quadro Ethernet uma tag de 4 bytes cujo campo VID tem 12 bits. Cada VLAN forma um domínio de broadcast próprio, a comunicação entre VLANs exige roteamento (camada 3) e são as portas tronco (trunk) que transportam quadros marcados de várias VLANs."},{"id":"vunesp-redes-03","disciplina":"redes","assunto":"Correio eletrônico (SMTP, IMAP, POP3)","dificuldade":2,"enunciado":"Sobre os protocolos de correio eletrônico, é correto afirmar que","alternativas":["o POP3 é o protocolo utilizado para transferir mensagens entre servidores de correio.","o SMTP é utilizado pelo cliente para ler as mensagens armazenadas na caixa postal.","o IMAP utiliza, por padrão, a porta TCP 25 nas conexões sem criptografia.","o POP3 utiliza, por padrão, a porta TCP 143 nas conexões sem criptografia.","o IMAP mantém as mensagens em pastas no servidor, sincronizadas entre dispositivos."],"correta":4,"comentario":"O IMAP (porta 143) mantém mensagens e pastas no servidor, o que permite o acesso sincronizado a partir de vários dispositivos. O POP3 (porta 110) serve para baixar as mensagens da caixa postal, e o SMTP (porta 25) é o protocolo de envio e de transferência entre servidores."},{"id":"vunesp-redes-04","disciplina":"redes","assunto":"MPLS","dificuldade":3,"enunciado":"No contexto de redes MPLS (Multiprotocol Label Switching), é correto afirmar que","alternativas":["o rótulo é atribuído pelo host de origem, antes de o pacote ser entregue ao primeiro roteador da rede.","os roteadores do núcleo (LSR) encaminham os pacotes pelo rótulo, sem consultar o IP de destino.","o cabeçalho MPLS é inserido depois do cabeçalho da camada de transporte do pacote.","o rótulo tem significado global e permanece o mesmo em todos os saltos do caminho.","a tecnologia funciona somente sobre enlaces ATM, não sendo compatível com Ethernet."],"correta":1,"comentario":"No MPLS, o roteador de borda de entrada (LER) classifica o pacote e insere o rótulo entre os cabeçalhos das camadas 2 e 3. Os LSR do núcleo encaminham por troca de rótulos, que têm significado apenas local, ao longo do caminho (LSP). O MPLS independe da tecnologia de enlace."},{"id":"vunesp-redes-05","disciplina":"redes","assunto":"VoIP (SIP e RTP)","dificuldade":2,"enunciado":"Em uma chamada VoIP, os protocolos responsáveis, respectivamente, pela sinalização (estabelecimento, modificação e encerramento da sessão) e pelo transporte do áudio em tempo real são","alternativas":["RTP e SIP.","SDP e RTCP.","RTCP e SDP.","SIP e RTP.","SIP e RTCP."],"correta":3,"comentario":"O SIP (Session Initiation Protocol) cuida da sinalização: inicia, modifica e encerra as sessões. O RTP (Real-time Transport Protocol) transporta a mídia, em geral sobre UDP. O RTCP apenas leva informações de controle e de qualidade do RTP, e o SDP descreve os parâmetros da sessão."},{"id":"vunesp-redes-06","disciplina":"redes","assunto":"Topologias de rede","dificuldade":1,"enunciado":"Assinale a alternativa que apresenta a topologia física de rede em que cada dispositivo é ligado por um cabo próprio a um equipamento central, como um switch, de modo que o rompimento de um cabo afeta apenas o dispositivo conectado a ele.","alternativas":["Estrela","Anel","Barramento","Malha completa","Ponto a ponto"],"correta":0,"comentario":"Na topologia em estrela, todos os nós se ligam a um concentrador central (switch ou hub). A falha de um cabo isola somente o nó correspondente, mas a falha do equipamento central derruba a rede. No barramento, os nós compartilham um único cabo, e no anel cada nó se liga a dois vizinhos."},{"id":"vunesp-seguranca-01","disciplina":"seguranca","assunto":"Assinatura digital","dificuldade":1,"enunciado":"Na geração de uma assinatura digital com criptografia assimétrica, o signatário calcula o resumo criptográfico (hash) do documento e o cifra com","alternativas":["sua chave pública, e a verificação é feita com a chave privada do signatário.","a chave pública do destinatário, e a verificação é feita com a chave privada do destinatário.","a chave privada do destinatário, e a verificação é feita com a chave pública do destinatário.","sua chave privada, e a verificação é feita com a chave pública do signatário.","uma chave simétrica de sessão, e a verificação é feita com essa mesma chave."],"correta":3,"comentario":"A assinatura digital é produzida com a chave privada do signatário, que só ele possui, e conferida por qualquer pessoa com a chave pública correspondente, o que dá autenticidade, integridade e não repúdio. Cifrar com a chave pública do destinatário serve à confidencialidade, não à assinatura."},{"id":"vunesp-seguranca-02","disciplina":"seguranca","assunto":"Códigos maliciosos","dificuldade":1,"enunciado":"Assinale a alternativa que apresenta o tipo de código malicioso capaz de se propagar automaticamente pelas redes, explorando vulnerabilidades e enviando cópias de si mesmo, sem precisar se anexar a outros arquivos nem ser executado pelo usuário.","alternativas":["Vírus","Worm","Cavalo de Troia (trojan)","Spyware","Rootkit"],"correta":1,"comentario":"O worm se propaga sozinho pela rede, explorando vulnerabilidades e enviando cópias de si mesmo. O vírus depende da execução do arquivo hospedeiro infectado, o trojan se disfarça de programa legítimo, o spyware monitora o usuário e o rootkit oculta a presença do invasor."},{"id":"vunesp-seguranca-03","disciplina":"seguranca","assunto":"OWASP Top 10","dificuldade":2,"enunciado":"Uma aplicação web permite que um usuário autenticado visualize os dados de outro usuário apenas trocando, na URL, o número identificador da conta. Segundo o OWASP Top 10 (edição 2021), essa falha pertence à categoria","alternativas":["Quebra de controle de acesso (Broken Access Control).","Injeção (Injection).","Falhas criptográficas (Cryptographic Failures).","Falhas de identificação e autenticação (Identification and Authentication Failures).","Falsificação de requisição do lado do servidor (SSRF)."],"correta":0,"comentario":"O usuário está autenticado, mas a aplicação não verifica se ele tem autorização para acessar o recurso pedido (referência direta insegura a objeto). Trata-se de quebra de controle de acesso, a primeira categoria do OWASP Top 10 de 2021."},{"id":"vunesp-seguranca-04","disciplina":"seguranca","assunto":"Backup (tipos e restauração)","dificuldade":2,"enunciado":"Uma organização executa backup completo aos domingos e backup diferencial de segunda a sábado, sempre à noite. Para restaurar todos os dados após uma falha ocorrida na quinta-feira pela manhã, são necessários","alternativas":["o backup completo de domingo e os diferenciais de segunda, terça e quarta-feira.","apenas o backup diferencial de quarta-feira.","o backup completo de domingo e apenas o diferencial de segunda-feira.","apenas os backups diferenciais de segunda, terça e quarta-feira.","o backup completo de domingo e apenas o diferencial de quarta-feira."],"correta":4,"comentario":"O backup diferencial copia tudo o que mudou desde o último backup completo. Por isso, a restauração exige só o último completo e o último diferencial (o de quarta-feira). No esquema incremental, que copia apenas o que mudou desde o último backup de qualquer tipo, seriam necessários todos os incrementais."},{"id":"vunesp-seguranca-05","disciplina":"seguranca","assunto":"Kerberos, SSO, OAuth 2.0 e OIDC","dificuldade":3,"enunciado":"No contexto de autenticação e autorização, é correto afirmar que","alternativas":["o OAuth 2.0 é um protocolo de autenticação baseado em tíquetes emitidos por um centro de distribuição de chaves (KDC).","o Kerberos utiliza apenas criptografia de chave pública e dispensa uma terceira parte confiável.","o OpenID Connect é uma camada de identidade sobre o OAuth 2.0, que acrescenta o ID Token.","no Kerberos, o tíquete de concessão de tíquetes (TGT) é emitido pelo servidor da aplicação acessada.","o single sign-on (SSO) exige que o usuário informe suas credenciais a cada aplicação que acessar."],"correta":2,"comentario":"O OAuth 2.0 é um framework de autorização delegada baseado em tokens de acesso. O OpenID Connect o estende com o ID Token, que identifica o usuário autenticado. O Kerberos usa criptografia simétrica e um KDC confiável, que emite o TGT. No SSO, uma única autenticação dá acesso a vários sistemas."},{"id":"vunesp-seguranca-06","disciplina":"seguranca","assunto":"Zero Trust e defesa em profundidade","dificuldade":2,"enunciado":"Assinale a alternativa que apresenta um princípio do modelo de segurança Zero Trust (confiança zero).","alternativas":["Usuários e dispositivos conectados à rede interna são considerados confiáveis por padrão.","Todo acesso é verificado e autorizado explicitamente, mesmo quando tem origem na rede interna.","A autenticação feita na entrada da rede vale para todos os recursos, sem novas verificações.","Os usuários recebem privilégios amplos, para reduzir a quantidade de solicitações de acesso.","A proteção concentra-se em um único firewall de perímetro, sem outras camadas de controle."],"correta":1,"comentario":"O Zero Trust segue o lema nunca confiar, sempre verificar: a localização na rede não gera confiança implícita, cada acesso é autenticado e autorizado, e aplica-se o privilégio mínimo. Ele combina com a defesa em profundidade, que usa várias camadas de controle em vez de depender só do perímetro."},{"id":"vunesp-banco-de-dados-01","disciplina":"banco-de-dados","assunto":"SQL DDL e restrições","dificuldade":2,"enunciado":"Considere a tabela criada pelo comando SQL padrão:\\n```\\nCREATE TABLE produto (\\n  id INT PRIMARY KEY,\\n  nome VARCHAR(50) NOT NULL,\\n  preco DECIMAL(8,2) CHECK (preco > 0)\\n);\\n```\\nEstando a tabela vazia, assinale a alternativa que apresenta um comando executado com sucesso.","alternativas":["INSERT INTO produto VALUES (1, \'Caneta\', 2.50);","INSERT INTO produto VALUES (NULL, \'Caneta\', 2.50);","INSERT INTO produto VALUES (1, NULL, 2.50);","INSERT INTO produto VALUES (1, \'Caneta\', 0);","INSERT INTO produto VALUES (1, \'Caneta\', -2.50);"],"correta":0,"comentario":"A chave primária não aceita NULL, a coluna nome é NOT NULL e a restrição CHECK exige preco maior que zero, o que rejeita 0 e valores negativos. Somente a inserção com id 1, nome preenchido e preço 2.50 satisfaz todas as restrições."},{"id":"vunesp-banco-de-dados-02","disciplina":"banco-de-dados","assunto":"Índices (B+, hash, clusterizado)","dificuldade":3,"enunciado":"No contexto de índices em bancos de dados relacionais, é correto afirmar que","alternativas":["o índice hash é o mais indicado para consultas por intervalo de valores (range).","na árvore B+, os registros ficam nos nós internos, e as folhas guardam apenas chaves de roteamento.","a criação de índices acelera, na mesma proporção, consultas, inserções e atualizações.","uma tabela admite apenas um índice clusterizado, pois ele define a ordem física das linhas.","as folhas de uma árvore B+ ficam em níveis diferentes, conforme a ordem das inserções."],"correta":3,"comentario":"O índice clusterizado determina a ordem física de armazenamento das linhas, por isso só pode haver um por tabela. Na árvore B+, que é balanceada, os dados ficam nas folhas encadeadas, o que favorece buscas por intervalo. O hash atende bem só a buscas por igualdade, e índices oneram as escritas."},{"id":"vunesp-banco-de-dados-03","disciplina":"banco-de-dados","assunto":"NoSQL: tipos de bancos","dificuldade":1,"enunciado":"Assinale a alternativa que relaciona corretamente um banco de dados NoSQL ao seu modelo de dados predominante.","alternativas":["Redis: orientado a grafos","Neo4j: chave-valor","MongoDB: orientado a documentos","Cassandra: orientado a documentos","HBase: orientado a grafos"],"correta":2,"comentario":"O MongoDB armazena documentos no formato BSON, semelhante ao JSON. O Redis é um banco chave-valor em memória, o Neo4j é orientado a grafos, e Cassandra e HBase são bancos colunares (família de colunas)."},{"id":"vunesp-banco-de-dados-04","disciplina":"banco-de-dados","assunto":"Big Data: 5 Vs, Hadoop e Spark","dificuldade":2,"enunciado":"No contexto de Big Data, é correto afirmar que","alternativas":["o Spark processa os dados apenas em disco, o que o torna mais lento que o MapReduce.","o V de variedade refere-se à rapidez com que os dados são gerados e processados.","o YARN é o componente do Hadoop responsável pelo armazenamento distribuído dos arquivos.","o MapReduce exige que os dados estejam em tabelas relacionais normalizadas.","o HDFS é o sistema de arquivos distribuído do Hadoop e replica os blocos entre os nós."],"correta":4,"comentario":"O HDFS divide os arquivos em blocos e os replica em vários nós do cluster, o que garante tolerância a falhas. O YARN gerencia recursos e agenda tarefas, o Spark processa em memória (em geral mais rápido que o MapReduce) e a rapidez de geração dos dados corresponde ao V de velocidade."},{"id":"vunesp-banco-de-dados-05","disciplina":"banco-de-dados","assunto":"Arquitetura ANSI/SPARC","dificuldade":2,"enunciado":"Na arquitetura de três esquemas (ANSI/SPARC), a capacidade de alterar o esquema interno, por exemplo criando um índice ou reorganizando arquivos, sem a necessidade de alterar o esquema conceitual, é denominada","alternativas":["independência lógica de dados.","independência física de dados.","integridade referencial.","transparência de replicação.","restrição de domínio."],"correta":1,"comentario":"A independência física permite mudar o nível interno (estruturas de armazenamento, índices) sem afetar o esquema conceitual. Já a independência lógica é a capacidade de alterar o esquema conceitual sem ter de alterar os esquemas externos nem os programas de aplicação."},{"id":"vunesp-banco-de-dados-06","disciplina":"banco-de-dados","assunto":"DELETE x TRUNCATE x DROP","dificuldade":1,"enunciado":"Sobre os comandos SQL DELETE, TRUNCATE e DROP aplicados a uma tabela, é correto afirmar que","alternativas":["TRUNCATE TABLE aceita a cláusula WHERE para selecionar as linhas a remover.","DELETE sem a cláusula WHERE remove do banco de dados a estrutura da tabela.","DROP TABLE remove as linhas e também a definição (estrutura) da tabela.","DELETE é um comando de DDL, enquanto DROP TABLE é um comando de DML.","TRUNCATE TABLE remove a definição da tabela, mas preserva as suas linhas."],"correta":2,"comentario":"DROP TABLE elimina a tabela inteira: dados e definição. TRUNCATE remove todas as linhas de uma vez, sem WHERE, mantendo a estrutura, e é classificado como DDL. DELETE é DML, remove as linhas que atendem ao WHERE (ou todas, se ele for omitido) e também mantém a estrutura."},{"id":"vunesp-engenharia-de-software-01","disciplina":"engenharia-de-software","assunto":"Engenharia de requisitos","dificuldade":1,"enunciado":"Assinale a alternativa que apresenta um requisito não funcional de um sistema de software.","alternativas":["O sistema deve permitir o cadastro de novos clientes.","O sistema deve emitir o relatório mensal de vendas por filial.","O sistema deve permitir que o usuário cancele um pedido em aberto.","O sistema deve calcular o valor do frete conforme o CEP informado.","O sistema deve responder a cada consulta em até 2 segundos."],"correta":4,"comentario":"Requisitos não funcionais expressam restrições e atributos de qualidade, como desempenho, segurança, usabilidade e disponibilidade. O tempo máximo de resposta é um requisito de desempenho. As demais opções descrevem funções que o sistema deve oferecer, isto é, requisitos funcionais."},{"id":"vunesp-engenharia-de-software-02","disciplina":"engenharia-de-software","assunto":"Técnicas de teste (valor-limite)","dificuldade":2,"enunciado":"Um campo aceita idades inteiras de 18 a 65, inclusive. Aplicando a técnica de análise do valor-limite, assinale a alternativa que apresenta os valores de teste formados pelos limites da faixa válida e pelos valores inválidos imediatamente vizinhos.","alternativas":["18, 40 e 65","10, 40 e 70","17, 18, 65 e 66","19, 40 e 64","0, 18, 65 e 100"],"correta":2,"comentario":"A análise do valor-limite, técnica de caixa-preta, concentra os testes nas fronteiras das partições, onde os defeitos são mais frequentes. Para a faixa de 18 a 65, testam-se os limites 18 e 65 e os vizinhos inválidos 17 e 66. Valores como 10, 40 e 70 apenas representam as partições de equivalência."},{"id":"vunesp-engenharia-de-software-03","disciplina":"engenharia-de-software","assunto":"Princípios SOLID","dificuldade":2,"enunciado":"Assinale a alternativa que apresenta o princípio SOLID segundo o qual módulos de alto nível não devem depender de módulos de baixo nível, devendo ambos depender de abstrações.","alternativas":["Responsabilidade Única","Aberto/Fechado","Substituição de Liskov","Inversão de Dependência","Segregação de Interfaces"],"correta":3,"comentario":"O Princípio da Inversão de Dependência (o D de SOLID) determina que módulos de alto e de baixo nível dependam de abstrações, e que as abstrações não dependam de detalhes. Isso reduz o acoplamento e facilita a troca de implementações, por exemplo com injeção de dependência."},{"id":"vunesp-engenharia-de-software-04","disciplina":"engenharia-de-software","assunto":"Git (commit, branch, merge, rebase)","dificuldade":2,"enunciado":"No sistema de controle de versão Git, é correto afirmar que","alternativas":["o rebase reaplica os commits de um branch sobre outra base, gerando commits com novos hashes.","o merge exclui automaticamente o branch de origem logo após concluir a integração.","o rebase preserva os identificadores (hashes) originais dos commits que são reaplicados.","o commit envia as alterações confirmadas diretamente para o repositório remoto.","a criação de um branch duplica todos os arquivos do repositório em um novo diretório de trabalho."],"correta":0,"comentario":"O rebase reescreve o histórico: os commits são reaplicados sobre a nova base e recebem novos hashes, deixando o histórico linear. O merge une os históricos sem apagar branches, o commit grava apenas no repositório local (o envio é feito com push) e um branch é só um ponteiro para um commit."},{"id":"vunesp-engenharia-de-software-05","disciplina":"engenharia-de-software","assunto":"Acoplamento e coesão","dificuldade":1,"enunciado":"No projeto de software, considera-se boa prática que os módulos apresentem","alternativas":["baixa coesão e alto acoplamento.","alta coesão e baixo acoplamento.","alta coesão e alto acoplamento.","baixa coesão e baixo acoplamento.","coesão coincidental e acoplamento por conteúdo."],"correta":1,"comentario":"Coesão mede o quanto os elementos de um módulo se relacionam a uma única responsabilidade, e acoplamento mede a dependência entre módulos. Alta coesão e baixo acoplamento facilitam manutenção, reúso e testes. Coesão coincidental e acoplamento por conteúdo são os piores tipos."},{"id":"vunesp-engenharia-de-software-06","disciplina":"engenharia-de-software","assunto":"Verificação, validação e regressão","dificuldade":3,"enunciado":"No contexto de verificação, validação e testes de software, é correto afirmar que","alternativas":["a validação avalia se o produto foi construído corretamente, de acordo com a especificação.","a verificação avalia se o produto construído atende às necessidades reais do usuário.","o teste de estresse avalia o comportamento do sistema sob a carga normal prevista de uso.","o teste de regressão reexecuta testes após uma mudança, em busca de defeitos no que já funcionava.","o teste de usabilidade mede o tempo de resposta do sistema sob grande volume de dados."],"correta":3,"comentario":"O teste de regressão confirma que alterações não introduziram defeitos em funcionalidades antes corretas. Verificação pergunta se o produto foi construído corretamente (conforme a especificação), e validação, se foi construído o produto certo. O teste de estresse leva o sistema além da carga normal."},{"id":"vunesp-sistemas-operacionais-01","disciplina":"sistemas-operacionais","assunto":"Semáforos, mutex e seção crítica","dificuldade":2,"enunciado":"No contexto de sincronização de processos, é correto afirmar que","alternativas":["a exclusão mútua permite que vários processos executem ao mesmo tempo a mesma seção crítica.","a operação wait (P) sobre um semáforo de valor zero bloqueia o processo até ocorrer um signal (V).","o mutex assume qualquer valor inteiro positivo, controlando várias instâncias de um recurso.","a operação signal (V) decrementa o valor do semáforo e pode bloquear o processo chamador.","a seção crítica é o trecho do código em que o processo não acessa recursos compartilhados."],"correta":1,"comentario":"No semáforo, wait (P) decrementa o valor e bloqueia o processo se não houver unidade disponível, e signal (V) incrementa o valor ou acorda um processo bloqueado. O mutex é binário (livre ou ocupado), e a seção crítica é justamente o trecho que acessa recursos compartilhados e exige exclusão mútua."},{"id":"vunesp-sistemas-operacionais-02","disciplina":"sistemas-operacionais","assunto":"Linux: permissões (chmod)","dificuldade":1,"enunciado":"No Linux, após a execução do comando chmod 640 relatorio.txt, as permissões do arquivo, exibidas pelo comando ls -l, passam a ser","alternativas":["rw-rw----","rwxr-----","rw-r--r--","r--rw----","rw-r-----"],"correta":4,"comentario":"No modo octal, cada dígito soma leitura (4), escrita (2) e execução (1) para dono, grupo e outros, nessa ordem. Assim, 6 = rw-, 4 = r-- e 0 = ---, resultando em rw-r-----: o dono lê e grava, o grupo apenas lê e os demais usuários não têm acesso."},{"id":"vunesp-sistemas-operacionais-03","disciplina":"sistemas-operacionais","assunto":"Windows: NTFS e PowerShell","dificuldade":2,"enunciado":"No contexto do sistema operacional Windows, é correto afirmar que","alternativas":["no acesso pela rede, entre as permissões NTFS e as de compartilhamento, prevalece a mais restritiva.","o sistema de arquivos NTFS aplica permissões apenas ao volume inteiro, e não a pastas e arquivos.","uma permissão Negar explícita é ignorada sempre que há uma permissão Permitir herdada da pasta pai.","o cmdlet Get-ChildItem do PowerShell é utilizado para encerrar processos em execução.","os cmdlets do PowerShell seguem o padrão substantivo-verbo, como ocorre em Process-Get."],"correta":0,"comentario":"Quando um recurso é acessado pela rede, valem ao mesmo tempo as permissões de compartilhamento e as NTFS, e o resultado efetivo é o mais restritivo. O NTFS permite permissões por pasta e arquivo, a negação explícita tem precedência, e os cmdlets seguem o padrão verbo-substantivo, como Get-Process."},{"id":"vunesp-sistemas-operacionais-04","disciplina":"sistemas-operacionais","assunto":"Shell: redirecionamento e pipes","dificuldade":1,"enunciado":"No shell Bash, assinale a alternativa que apresenta o comando que acrescenta a saída padrão do comando ls ao final do arquivo lista.txt, preservando o conteúdo já existente.","alternativas":["ls > lista.txt","ls < lista.txt","ls >> lista.txt","ls | lista.txt","ls 2> lista.txt"],"correta":2,"comentario":"O operador >> redireciona a saída padrão em modo de acréscimo (append). O operador > sobrescreve o arquivo, < redireciona a entrada padrão, 2> redireciona a saída de erros e o pipe (|) liga a saída de um comando à entrada de outro comando, não a um arquivo."},{"id":"vunesp-sistemas-operacionais-05","disciplina":"sistemas-operacionais","assunto":"Thrashing, TLB e localidade","dificuldade":3,"enunciado":"No contexto de gerência de memória virtual, é correto afirmar que","alternativas":["a TLB é uma área do disco que guarda as páginas retiradas da memória principal.","um acerto na TLB (TLB hit) exige nova consulta à tabela de páginas mantida na memória.","pelo princípio da localidade, os acessos distribuem-se uniformemente por todo o espaço de endereçamento.","o thrashing ocorre quando o sistema gasta mais tempo com paginação do que executando processos.","aumentar o grau de multiprogramação é a medida indicada para eliminar o thrashing."],"correta":3,"comentario":"No thrashing, a falta de quadros livres provoca faltas de página em excesso, e o sistema passa a maior parte do tempo trocando páginas com o disco. A TLB é uma cache de hardware com traduções recentes de endereços, e a localidade indica que os acessos se concentram em poucas páginas a cada período."},{"id":"vunesp-sistemas-operacionais-06","disciplina":"sistemas-operacionais","assunto":"Condição de corrida","dificuldade":2,"enunciado":"Dois threads executam, uma vez cada um e sem mecanismo de sincronização, a instrução x = x + 1 sobre a variável compartilhada x, de valor inicial 0. A instrução é realizada em três passos: ler x, somar 1 e gravar x. Ao final, os valores possíveis de x são","alternativas":["apenas 0.","apenas 1.","apenas 2.","0, 1 ou 2.","1 ou 2."],"correta":4,"comentario":"Há uma condição de corrida: o resultado depende da intercalação dos passos. Se um thread termina antes de o outro ler x, o resultado é 2. Se ambos leem 0 antes de qualquer gravação, uma atualização se perde e o resultado é 1. A solução é proteger a seção crítica com exclusão mútua."},{"id":"vunesp-programacao-01","disciplina":"programacao","assunto":"Árvores AVL, rubro-negra e B","dificuldade":3,"enunciado":"No contexto de árvores de busca balanceadas, é correto afirmar que","alternativas":["em uma árvore rubro-negra, a raiz é sempre vermelha, e as folhas nulas são pretas.","em uma árvore rubro-negra, um nó vermelho pode ter filhos também vermelhos.","em uma árvore AVL, as alturas das duas subárvores de qualquer nó diferem em, no máximo, 1.","em uma árvore B, as folhas podem ficar em níveis diferentes, conforme a ordem das inserções.","em uma árvore AVL com n nós, a operação de busca tem custo O(n) no pior caso."],"correta":2,"comentario":"A árvore AVL mantém o fator de balanceamento de cada nó entre -1 e 1, corrigindo desvios com rotações, o que garante busca em O(log n). Na rubro-negra, a raiz é preta e um nó vermelho só tem filhos pretos. Na árvore B, todas as folhas ficam no mesmo nível."},{"id":"vunesp-programacao-02","disciplina":"programacao","assunto":"Busca binária","dificuldade":1,"enunciado":"Sobre o algoritmo de busca binária aplicado a um vetor de n elementos, é correto afirmar que","alternativas":["exige que o vetor esteja ordenado e tem complexidade O(log n) no pior caso.","funciona em vetores não ordenados e tem complexidade O(log n) no pior caso.","exige que o vetor esteja ordenado e tem complexidade O(n) no pior caso.","compara a chave com cada elemento, em sequência, a partir da primeira posição.","exige que o vetor esteja ordenado e tem complexidade O(n log n) no pior caso."],"correta":0,"comentario":"A busca binária compara a chave com o elemento central e descarta a metade em que ela não pode estar, o que só é possível se o vetor estiver ordenado. Como o espaço de busca cai pela metade a cada passo, o pior caso é O(log n). Comparar elemento a elemento é a busca sequencial, O(n)."},{"id":"vunesp-programacao-03","disciplina":"programacao","assunto":"Java: exceções e modificadores","dificuldade":2,"enunciado":"Na linguagem Java, é correto afirmar que","alternativas":["um membro private pode ser acessado por qualquer classe do mesmo pacote.","um membro sem modificador de acesso pode ser acessado por classes de qualquer pacote.","exceções derivadas de RuntimeException precisam ser capturadas ou declaradas com throws.","um membro protected é acessível no mesmo pacote e em subclasses de outros pacotes.","o bloco finally é executado somente quando nenhuma exceção é lançada no bloco try."],"correta":3,"comentario":"O modificador protected dá acesso ao próprio pacote e às subclasses, mesmo de outros pacotes. Um membro private só é visível na própria classe, e sem modificador o acesso fica restrito ao pacote. RuntimeException é não verificada (unchecked), e o finally executa havendo ou não exceção."},{"id":"vunesp-programacao-04","disciplina":"programacao","assunto":"Lógica de programação","dificuldade":1,"enunciado":"Considere as variáveis lógicas P = verdadeiro, Q = falso e R = verdadeiro. Assinale a alternativa que apresenta a expressão cujo resultado é verdadeiro.","alternativas":["P E Q E R","(P E Q) OU R","(NÃO P) OU Q","(P OU Q) E (NÃO R)","NÃO (P OU R)"],"correta":1,"comentario":"P E Q é falso, pois Q é falso, mas o OU com R (verdadeiro) torna a expressão verdadeira. Nas demais: P E Q E R é falso porque Q é falso; (NÃO P) OU Q é falso OU falso; (P OU Q) E (NÃO R) é verdadeiro E falso; e NÃO (P OU R) nega um valor verdadeiro."},{"id":"vunesp-programacao-05","disciplina":"programacao","assunto":"Técnicas de projeto de algoritmos","dificuldade":2,"enunciado":"Assinale a alternativa que relaciona corretamente o algoritmo à técnica de projeto em que ele se baseia.","alternativas":["Algoritmo de Dijkstra: divisão e conquista","Busca binária: programação dinâmica","Algoritmo de Kruskal: programação dinâmica","Quicksort: método guloso","Mergesort: divisão e conquista"],"correta":4,"comentario":"O mergesort divide o vetor em duas metades, ordena cada uma recursivamente e intercala os resultados: é divisão e conquista, como o quicksort. Dijkstra e Kruskal são gulosos, pois fazem a melhor escolha local a cada passo. A programação dinâmica guarda soluções de subproblemas sobrepostos."},{"id":"vunesp-programacao-06","disciplina":"programacao","assunto":"Pseudocódigo (teste de mesa)","dificuldade":2,"enunciado":"Considere o pseudocódigo a seguir, em que o primeiro elemento do vetor tem índice 1:\\n```\\nv <- [3, 1, 4, 1, 5]\\npara i de 2 até 5 faça\\n  v[i] <- v[i] + v[i-1]\\nfimpara\\nescreva(v[3] + v[5])\\n```\\nO valor exibido ao final da execução é","alternativas":["9","11","22","14","17"],"correta":2,"comentario":"Cada posição recebe a soma dela com a anterior já atualizada (soma acumulada): v[2] = 1 + 3 = 4, v[3] = 4 + 4 = 8, v[4] = 1 + 8 = 9 e v[5] = 5 + 9 = 14. O vetor final é [3, 4, 8, 9, 14], e v[3] + v[5] vale 8 + 14 = 22."},{"id":"vunesp-governanca-01","disciplina":"governanca","assunto":"ITIL 4: SLA e catálogo de serviços","dificuldade":1,"enunciado":"No ITIL 4, o acordo documentado entre o provedor de serviço e o cliente que identifica os serviços requeridos e o nível de serviço esperado é denominado","alternativas":["acordo de nível de serviço (SLA).","catálogo de serviços.","requisição de serviço.","registro de problema.","plano de continuidade de serviço."],"correta":0,"comentario":"O SLA (Service Level Agreement) é o acordo documentado entre provedor e cliente que define os serviços e os níveis esperados, tratado pela prática de gerenciamento de nível de serviço. Já o catálogo de serviços é a fonte única de informações sobre os serviços oferecidos pelo provedor."},{"id":"vunesp-governanca-02","disciplina":"governanca","assunto":"Cronograma e caminho crítico","dificuldade":3,"enunciado":"Um projeto tem as tarefas T1 (4 dias), T2 (5 dias), T3 (2 dias) e T4 (4 dias). T1 e T2 não têm predecessoras, T3 depende de T1, e T4 depende de T2 e de T3. Pelo método do caminho crítico, a duração do projeto e a folga total da tarefa T2 são, respectivamente,","alternativas":["9 dias e zero.","9 dias e 1 dia.","10 dias e zero.","10 dias e 1 dia.","15 dias e zero."],"correta":3,"comentario":"Há dois caminhos: T1, T3, T4 (4 + 2 + 4 = 10 dias) e T2, T4 (5 + 4 = 9 dias). O caminho crítico é o mais longo e define a duração do projeto: 10 dias. A tarefa T2 pode atrasar 10 - 9 = 1 dia sem atrasar o término, logo sua folga total é de 1 dia. Tarefas do caminho crítico têm folga zero."},{"id":"vunesp-governanca-03","disciplina":"governanca","assunto":"PETI e PDTIC","dificuldade":2,"enunciado":"No planejamento de TI das organizações públicas, é correto afirmar que o Plano Diretor de Tecnologia da Informação e Comunicação (PDTIC)","alternativas":["define a missão, a visão e os valores institucionais do órgão como um todo.","é instrumento de diagnóstico, planejamento e gestão dos recursos e processos de TIC.","substitui o planejamento estratégico institucional, tornando-o dispensável.","é elaborado somente pela área de TI, sem qualquer participação das áreas de negócio do órgão.","limita-se ao inventário dos equipamentos de informática existentes no órgão."],"correta":1,"comentario":"O PDTIC é o instrumento de diagnóstico, planejamento e gestão dos recursos e processos de TIC, voltado a atender às necessidades do órgão em determinado período. Ele deve estar alinhado ao planejamento estratégico institucional e ao PETI, e sua elaboração envolve as áreas de negócio."},{"id":"vunesp-governanca-04","disciplina":"governanca","assunto":"MPS.BR","dificuldade":2,"enunciado":"No modelo de referência MPS.BR para software (MR-MPS-SW), é correto afirmar que","alternativas":["há cinco níveis de maturidade, numerados de 1 a 5, de forma idêntica ao CMMI.","o nível A (Parcialmente Gerenciado) é o primeiro a ser alcançado pela organização.","o modelo foi criado e é mantido pelo Software Engineering Institute (SEI).","o nível F (Em Otimização) é o mais alto da escala de maturidade.","há sete níveis de maturidade, do G (Parcialmente Gerenciado) ao A (Em Otimização)."],"correta":4,"comentario":"O MPS.BR, coordenado pela Softex, define sete níveis de maturidade: G (Parcialmente Gerenciado), F (Gerenciado), E (Parcialmente Definido), D (Largamente Definido), C (Definido), B (Gerenciado Quantitativamente) e A (Em Otimização). O nível G é o primeiro a ser alcançado."},{"id":"vunesp-governanca-05","disciplina":"governanca","assunto":"Indicadores (KPI) e OKR","dificuldade":2,"enunciado":"No contexto de gestão do desempenho, é correto afirmar que, no método OKR (Objectives and Key Results),","alternativas":["os resultados-chave descrevem a missão permanente da organização.","os objetivos são sempre expressos em números, e os resultados-chave são descrições qualitativas.","os objetivos são qualitativos, e os resultados-chave são mensuráveis e indicam o progresso.","as metas são definidas uma única vez e não passam por revisões periódicas.","cada objetivo é acompanhado sem a necessidade de definir resultados-chave."],"correta":2,"comentario":"No OKR, o objetivo diz aonde se quer chegar, de forma qualitativa e inspiradora, e os resultados-chave são métricas que mostram se o objetivo está sendo atingido, revistas em ciclos curtos. Já o KPI é um indicador-chave que monitora continuamente o desempenho de um processo ou atividade."},{"id":"vunesp-governanca-06","disciplina":"governanca","assunto":"Matriz RACI","dificuldade":1,"enunciado":"Na matriz de responsabilidades RACI, o papel Accountable (o A da sigla) identifica quem","alternativas":["responde pelo resultado da atividade e a aprova.","executa a atividade.","deve ser consultado antes da decisão ou da execução.","deve ser informado sobre o andamento ou o resultado.","audita a atividade depois de sua conclusão."],"correta":0,"comentario":"RACI significa Responsible (quem executa), Accountable (quem responde pelo resultado e aprova, devendo ser único em cada atividade), Consulted (quem é consultado, em comunicação de mão dupla) e Informed (quem é informado, em comunicação de mão única)."},{"id":"vunesp-infraestrutura-01","disciplina":"infraestrutura","assunto":"RISC x CISC","dificuldade":2,"enunciado":"Assinale a alternativa que apresenta uma característica típica da arquitetura RISC, em comparação com a arquitetura CISC.","alternativas":["Grande variedade de modos de endereçamento e instruções de tamanho variável.","Uso intensivo de microprogramação para executar instruções complexas.","Poucos registradores de uso geral, com a maioria das operações realizada diretamente na memória.","Instruções simples de tamanho fixo, com acesso à memória restrito a instruções de load e store.","Instruções que consomem vários ciclos de relógio, o que dificulta o uso de pipeline."],"correta":3,"comentario":"A arquitetura RISC usa um conjunto reduzido de instruções simples e de formato fixo, muitos registradores, acesso à memória restrito a load e store e controle em geral implementado em hardware, o que favorece o pipeline. As demais características são típicas da arquitetura CISC."},{"id":"vunesp-infraestrutura-02","disciplina":"infraestrutura","assunto":"SAN x NAS x DAS","dificuldade":2,"enunciado":"No contexto de arquiteturas de armazenamento de dados, é correto afirmar que","alternativas":["a SAN oferece acesso em nível de arquivo, por meio dos protocolos NFS e SMB.","o NAS oferece acesso em nível de arquivo pela rede, por protocolos como NFS e SMB.","o DAS é compartilhado por vários servidores por meio de switches Fibre Channel.","o NAS é conectado diretamente a um único servidor, sem utilizar a rede.","o iSCSI é um protocolo de acesso em nível de arquivo, usado apenas em equipamentos NAS."],"correta":1,"comentario":"O NAS é um servidor de arquivos ligado à rede local, acessado por NFS ou SMB/CIFS. A SAN é uma rede dedicada que entrega armazenamento em nível de bloco, com Fibre Channel ou iSCSI. O DAS é o armazenamento conectado diretamente a um servidor, sem rede intermediária."},{"id":"vunesp-infraestrutura-03","disciplina":"infraestrutura","assunto":"Nuvem: modelos de implantação (NIST)","dificuldade":1,"enunciado":"Segundo a definição de computação em nuvem do NIST, assinale a alternativa que apresenta apenas modelos de implantação.","alternativas":["IaaS, PaaS e SaaS","Autosserviço sob demanda, elasticidade rápida e serviço medido","Nuvem privada, nuvem pública, IaaS e SaaS","Nuvem híbrida, nuvem comunitária e agrupamento de recursos","Nuvem privada, nuvem pública, nuvem comunitária e nuvem híbrida"],"correta":4,"comentario":"O NIST define quatro modelos de implantação: nuvem privada, comunitária, pública e híbrida. IaaS, PaaS e SaaS são modelos de serviço. Autosserviço sob demanda, amplo acesso pela rede, agrupamento de recursos, elasticidade rápida e serviço medido são as características essenciais."},{"id":"vunesp-infraestrutura-04","disciplina":"infraestrutura","assunto":"Data centers: classificação Tier","dificuldade":3,"enunciado":"Na classificação Tier de data centers do Uptime Institute, é correto afirmar que","alternativas":["o Tier I possui componentes redundantes e vários caminhos de distribuição ativos ao mesmo tempo.","o Tier II é tolerante a falhas em qualquer componente da infraestrutura do data center.","o Tier III permite manutenção planejada sem interromper a operação, mas não é tolerante a falhas.","o Tier IV é o nível mais básico da classificação, sem redundância de componentes.","quanto maior o Tier, menor é a disponibilidade esperada do data center."],"correta":2,"comentario":"São quatro níveis cumulativos: Tier I (capacidade básica, sem redundância), Tier II (componentes redundantes), Tier III (manutenção concorrente: qualquer componente pode ser retirado para manutenção sem parar a operação) e Tier IV (tolerante a falhas). Quanto maior o Tier, maior a disponibilidade."},{"id":"vunesp-infraestrutura-05","disciplina":"infraestrutura","assunto":"Snapshots, deduplicação e objetos","dificuldade":2,"enunciado":"Sobre recursos e tecnologias de armazenamento de dados, é correto afirmar que","alternativas":["a deduplicação elimina blocos de dados repetidos, mantendo uma única cópia e referências a ela.","o snapshot é sempre uma cópia física completa dos dados, gravada em outra mídia de armazenamento.","o armazenamento em objetos organiza os dados em blocos de tamanho fixo, sem metadados associados.","a deduplicação aumenta o espaço ocupado, pois grava cada bloco de dados duas vezes.","no armazenamento em objetos, o acesso aos dados é feito por protocolos de bloco, como o iSCSI."],"correta":0,"comentario":"A deduplicação identifica blocos idênticos e guarda só uma cópia, economizando espaço. O snapshot registra o estado dos dados em um instante, em geral por ponteiros e cópia na escrita, sem duplicar tudo. O armazenamento em objetos guarda dado, metadados e identificador único, com acesso por APIs HTTP."},{"id":"vunesp-infraestrutura-06","disciplina":"infraestrutura","assunto":"IoT e blockchain","dificuldade":1,"enunciado":"No contexto de Internet das Coisas (IoT) e de blockchain, é correto afirmar que","alternativas":["na blockchain, os registros ficam em um único servidor central, que valida as transações.","na blockchain, qualquer nó pode alterar livremente os blocos já incluídos na cadeia.","o MQTT é um mecanismo de consenso utilizado para validar blocos em redes blockchain.","a prova de trabalho (proof of work) é um protocolo leve de troca de mensagens para sensores de IoT.","na blockchain, cada bloco guarda o hash do bloco anterior, o que evidencia alterações indevidas."],"correta":4,"comentario":"A blockchain é um livro-razão distribuído em que cada bloco contém o hash do anterior: alterar um bloco invalida os seguintes. A validação ocorre por consenso entre os nós, como na prova de trabalho. O MQTT é um protocolo leve de mensagens, no modelo publish/subscribe, muito usado em IoT."}]')};function uu(e,t){let n=Qc.find(e=>e.id===t)?.formato??`multipla`,r={id:e.id,banca:t,disciplina:e.disciplina,assunto:e.assunto,dificuldade:e.dificuldade,enunciado:e.enunciado,comentario:e.comentario};return n===`certo-errado`?{...r,formato:n,alternativas:[`Certo`,`Errado`],correta:+!e.certo}:{...r,formato:n,alternativas:[...e.alternativas??[]],correta:e.correta??0}}var du=Object.fromEntries(Qc.map(e=>[e.id,lu[e.id].map(t=>uu(t,e.id))]));function fu(e,t){let n=e===`mista`?Qc.flatMap(e=>du[e.id]):du[e];return!t||t.length===0?[...n]:n.filter(e=>t.includes(e.disciplina))}function pu(e){for(let t of Qc){let n=du[t.id].find(t=>t.id===e);if(n)return n}}var mu={KeyE:`interagir`,Enter:`interagir`,NumpadEnter:`interagir`,Tab:`caderno`,KeyQ:`caderno`,Escape:`pausa`,KeyP:`pausa`,KeyM:`som`},hu=new Set([`KeyW`,`KeyA`,`KeyS`,`KeyD`,`ArrowUp`,`ArrowDown`,`ArrowLeft`,`ArrowRight`,`ShiftLeft`,`ShiftRight`,`Space`]),gu=56,_u=2.1,vu=class{canvas;ativa=!1;sensibilidade=1;aoAgir;aoPerderCaptura;aoDetectarToque;toque=matchMedia(`(hover: none) and (pointer: coarse)`).matches;teclas=new Set;olharX=0;olharY=0;capturado=!1;capturaRecusada=!1;jaCapturou=!1;arrasto;manche;visualDoManche;pino;constructor(e,t){this.canvas=e,this.visualDoManche=document.createElement(`div`),this.visualDoManche.className=`manche`,this.visualDoManche.hidden=!0,this.pino=document.createElement(`div`),this.pino.className=`manche-pino`,this.visualDoManche.append(this.pino),t.append(this.visualDoManche),addEventListener(`keydown`,e=>this.aoPressionar(e)
